# Local Supabase stack identifier only.
# Remote ownership is established explicitly with `supabase link --project-ref <ref>`.
# See docs/EASY_ERF_BACKEND_OWNERSHIP.md before any linked/remote command.
project_id = "easy-erf"

# Stripe authenticates this public endpoint with the Stripe-Signature header.
# The function rejects unsigned or invalid events before any database write.
[functions.easy-erf-stripe-webhook]
verify_jwt = false

# Founder fulfillment requires an authenticated Easy Erf session first, then
# performs an explicit admin-role check before any service-role transition.
[functions.easy-erf-founder-fulfillment]
verify_jwt = true

# Founder report upload only creates a short-lived signed upload token after
# authenticated admin authorization and exact paid-order validation.
[functions.easy-erf-founder-report-upload]
verify_jwt = true


# Human Review pricing resolves only the existing verified TEST Stripe Payment Link.
# The function returns a public Stripe-hosted URL and never creates a payment itself.
[functions.easy-erf-r999-checkout]
verify_jwt = false
