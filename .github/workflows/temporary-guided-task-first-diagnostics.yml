name: Temporary guided task first diagnostics

on:
  push:
    branches:
      - chatgpt/guided-task-first-mobile-header
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-guided-task-first-diagnostics
  cancel-in-progress: true

jobs:
  focused:
    name: Test ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: new-guardrail
            test_file: src/components/property/__tests__/guidedTaskFirstUx.test.ts
          - label: takeover-truth
            test_file: src/components/humanReview/__tests__/humanReviewTakeoverCardTruth.test.ts
          - label: simplification
            test_file: src/components/property/__tests__/simplificationPassB.test.ts
          - label: dossier-ux
            test_file: src/components/property/__tests__/dossierUx.test.ts

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guided-task-first-mobile-header

      - name: Apply the uncommitted UX patch in this isolated job
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/temporary-apply-guided-task-first-ux.mjs")
          text = path.read_text()
          needle = "${tab}"
          if text.count(needle) != 2:
              raise SystemExit(f"Expected two tab placeholders, found {text.count(needle)}")
          path.write_text(text.replace(needle, r"\${tab}"))
          PY
          node scripts/temporary-apply-guided-task-first-ux.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run isolated focused file
        run: npx vitest run "${{ matrix.test_file }}"
