name: Temporary guided task first diagnostics

on:
  push:
    branches:
      - chatgpt/guided-task-first-mobile-header
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-guided-task-first-diagnostics
  cancel-in-progress: true

jobs:
  discover:
    name: Discover dossier guardrail titles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      titles: ${{ steps.titles.outputs.titles }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guided-task-first-mobile-header

      - id: titles
        name: Parse individual test titles
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          source = Path("src/components/property/__tests__/dossierUx.test.ts").read_text()
          titles = re.findall(r'\bit\("([^"]+)"', source)
          if not titles:
              raise SystemExit("No dossier test titles found")
          print("titles=" + json.dumps(titles))
          PY

  isolated:
    name: Dossier guardrail | ${{ matrix.title }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        title: ${{ fromJson(needs.discover.outputs.titles) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guided-task-first-mobile-header

      - name: Apply proposed UX patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/temporary-apply-guided-task-first-ux.mjs")
          text = path.read_text()
          needle = "${tab}"
          if text.count(needle) != 2:
              raise SystemExit(f"Expected two tab placeholders, found {text.count(needle)}")
          path.write_text(text.replace(needle, r"\${tab}"))
          PY
          node scripts/temporary-apply-guided-task-first-ux.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run one dossier guardrail
        env:
          TEST_TITLE: ${{ matrix.title }}
        run: npx vitest run src/components/property/__tests__/dossierUx.test.ts -t "$TEST_TITLE"
