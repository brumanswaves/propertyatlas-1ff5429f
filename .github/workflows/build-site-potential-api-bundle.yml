name: Build Site Potential API Edge bundle

on:
  push:
    branches:
      - codex/founder-site-potential-api
    paths:
      - .github/workflows/build-site-potential-api-bundle.yml

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/founder-site-potential-api
          fetch-depth: 0

      - name: Bundle founder-owned Site Potential API handler
        run: |
          npx --yes esbuild@0.25.11 src/lib/sitePotential/edgeApiRequest.ts \
            --bundle \
            --format=esm \
            --platform=neutral \
            --target=es2022 \
            --external:@supabase/supabase-js \
            --banner:js='// GENERATED from src/lib/sitePotential/edgeApiRequest.ts. Do not hand-edit.' \
            --outfile=supabase/functions/site-potential-api/handler.bundle.mjs

      - name: Commit generated bundle
        run: |
          if git diff --quiet -- supabase/functions/site-potential-api/handler.bundle.mjs; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/site-potential-api/handler.bundle.mjs
          git commit -m "Build Site Potential API edge bundle"
          git push origin HEAD:codex/founder-site-potential-api
