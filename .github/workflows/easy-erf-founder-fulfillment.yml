name: Easy Erf founder fulfillment verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/easy-erf-founder-fulfillment.yml
      - scripts/verify-easy-erf-founder-fulfillment.sql
      - scripts/verify-easy-erf-human-review-product.sql
      - scripts/verify-easy-erf-customer-notification.sql
      - scripts/verify-founder-fulfillment-browser.mjs
      - supabase/config.toml
      - supabase/functions/_shared/easyErfHumanReviewContract.ts
      - supabase/functions/easy-erf-founder-fulfillment/**
      - supabase/functions/easy-erf-founder-report-upload/**
      - supabase/functions/easy-erf-founder-customer-notification/**
      - supabase/migrations/20260831090000_easy_erf_founder_fulfillment_controls.sql
      - supabase/migrations/20260831113000_secure_easy_erf_report_delivery.sql
      - supabase/migrations/20260831130000_align_easy_erf_fulfillment_status_enum.sql
      - supabase/migrations/20260831142610_reopen_easy_erf_human_review.sql
      - supabase/migrations/20260831160318_controlled_human_review_product_v2.sql
      - supabase/migrations/20260903111500_require_resolved_founder_investigation_checklist.sql
      - supabase/migrations/20260903211000_record_manual_report_notification.sql
      - supabase/migrations/20260904114500_automatic_report_ready_email.sql
      - src/components/admin/FounderCustomerNotification.tsx
      - src/components/admin/FounderHumanReviewEditor.tsx
      - src/lib/humanReview/founderQueueSafety.ts
      - src/lib/humanReview/__tests__/founderQueueSafety.test.ts
      - src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts
      - src/lib/payments/__tests__/easyErfFounderFulfillmentGuardrails.test.ts
      - src/lib/payments/__tests__/easyErfFulfillmentUiGuardrails.test.ts
      - src/lib/payments/__tests__/easyErfFulfillmentStatusEnum.test.ts
      - src/routes/admin_.fulfillment.tsx
      - src/routes/orders.tsx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository with built-in Git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch --no-tags --depth=100 origin "${REF}"
          git checkout --detach FETCH_HEAD
          git fetch --no-tags --depth=100 origin main:refs/remotes/origin/main

      - name: Install verified Deno 2.9.6 binary and type-check founder functions
        run: |
          curl --fail --location --silent --show-error \
            --output deno.zip \
            https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-unknown-linux-gnu.zip
          echo "394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2  deno.zip" | sha256sum --check
          unzip -q deno.zip
          ./deno check --node-modules-dir=auto --no-lock supabase/functions/easy-erf-founder-fulfillment/index.ts
          ./deno check --node-modules-dir=auto --no-lock supabase/functions/easy-erf-founder-report-upload/index.ts
          ./deno check --node-modules-dir=auto --no-lock supabase/functions/easy-erf-founder-customer-notification/index.ts

      - name: Install dependencies and run focused guardrails
        run: |
          npm install --no-audit --no-fund
          npx vitest run \
            src/lib/humanReview/__tests__/founderQueueSafety.test.ts \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts \
            src/lib/payments/__tests__/easyErfFounderFulfillmentGuardrails.test.ts \
            src/lib/payments/__tests__/easyErfFulfillmentUiGuardrails.test.ts \
            src/lib/payments/__tests__/easyErfFulfillmentStatusEnum.test.ts

      - name: Apply and prove founder fulfillment and automatic notification contracts
        env:
          PGPASSWORD: postgres
        run: >-
          psql
          --host 127.0.0.1
          --port 54329
          --username postgres
          --dbname postgres
          --file scripts/verify-easy-erf-customer-notification.sql

      - name: Build production bundle and generate routes
        run: npm run build

      - name: Check TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Check changed-file lint
        run: >-
          npx eslint
          --no-warn-ignored
          --rule 'prettier/prettier: off'
          scripts/verify-founder-fulfillment-browser.mjs
          src/components/admin/FounderCustomerNotification.tsx
          src/components/admin/FounderHumanReviewEditor.tsx
          src/lib/humanReview/founderQueueSafety.ts
          src/lib/humanReview/__tests__/founderQueueSafety.test.ts
          src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts
          src/routes/admin_.fulfillment.tsx

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD

      - name: Operate the isolated founder workflow in the built app
        env:
          EASY_ERF_BROWSER_BASE_URL: http://127.0.0.1:4174
          EASY_ERF_BROWSER_ARTIFACTS: artifacts/founder-fulfillment
        run: |
          mkdir -p "${EASY_ERF_BROWSER_ARTIFACTS}"
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          npx vite preview --host 127.0.0.1 --port 4174 > "${EASY_ERF_BROWSER_ARTIFACTS}/preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "${PREVIEW_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${EASY_ERF_BROWSER_BASE_URL}/admin/fulfillment" >/dev/null; then
              break
            fi
            if ! kill -0 "${PREVIEW_PID}" 2>/dev/null; then
              cat "${EASY_ERF_BROWSER_ARTIFACTS}/preview.log"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error "${EASY_ERF_BROWSER_BASE_URL}/admin/fulfillment" >/dev/null
          node scripts/verify-founder-fulfillment-browser.mjs

      - name: Upload founder browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: founder-fulfillment-browser-${{ github.run_id }}
          path: artifacts/founder-fulfillment
          if-no-files-found: warn
          retention-days: 14
