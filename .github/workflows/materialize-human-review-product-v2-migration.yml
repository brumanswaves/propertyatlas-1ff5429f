name: Materialize Human Review product v2 migration

on:
  push:
    branches:
      - chatgpt/human-review-product-v2
    paths:
      - .github/workflows/materialize-human-review-product-v2-migration.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Generate migration with Supabase CLI and commit it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: chatgpt/human-review-product-v2
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=50 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
          npx --yes supabase@latest migration new controlled_human_review_product_v2
          MIGRATION_PATH="$(find supabase/migrations -maxdepth 1 -type f -name '*_controlled_human_review_product_v2.sql' | sort | tail -1)"
          test -n "${MIGRATION_PATH}"
          cp scripts/human-review-product-v2-migration.sql "${MIGRATION_PATH}"
          git diff --check
          git config user.name "Easy Erf CI"
          git config user.email "actions@users.noreply.github.com"
          git add "${MIGRATION_PATH}"
          git commit -m "Add controlled Human Review product migration"
          git push origin "HEAD:${HEAD_REF}"
