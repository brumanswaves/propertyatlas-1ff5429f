name: R999 reports visibility repair

on:
  push:
    branches:
      - chatgpt/visible-r999-reports-navigation
    paths:
      - .github/workflows/r999-reports-visibility-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Add commercial entry points
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: chatgpt/visible-r999-reports-navigation
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=50 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/routes/index.tsx",
              'import { createFileRoute } from "@tanstack/react-router";',
              'import { createFileRoute, Link } from "@tanstack/react-router";',
          )

          index_anchor = '''        subtitle={headerSubtitle}\n      />\n\n      {debugReopenEnabled && ('''
          index_replacement = '''        subtitle={headerSubtitle}\n      />\n\n      {!selected && !selectedOfficial && !showOfficialReopenCard && !searchHighlight && (\n        <div className="pointer-events-auto absolute bottom-20 left-1/2 z-20 w-[min(94vw,42rem)] -translate-x-1/2 rounded-2xl border border-accent/30 bg-card/95 p-3 shadow-panel backdrop-blur md:bottom-8">\n          <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">\n            <div>\n              <div className="text-[10px] font-semibold uppercase tracking-wider text-accent">\n                R999 · Human-reviewed\n              </div>\n              <div className="mt-1 text-sm font-semibold text-foreground">\n                Want Easy Erf to investigate the property with human review?\n              </div>\n              <div className="mt-1 text-[11px] leading-relaxed text-muted-foreground">\n                One property. Property Truth, potential, risks, unknowns and clear next steps.\n              </div>\n            </div>\n            <Link\n              to="/pricing"\n              className="inline-flex shrink-0 items-center justify-center rounded-full bg-accent px-4 py-2 text-xs font-semibold text-accent-foreground shadow-soft hover:bg-accent/90"\n            >\n              See the R999 review\n            </Link>\n          </div>\n        </div>\n      )}\n\n      {debugReopenEnabled && ('''
          replace_once("src/routes/index.tsx", index_anchor, index_replacement)

          dashboard_old = '''          <Link\n            to="/"\n            className="inline-flex items-center gap-1.5 rounded-full bg-primary px-4 py-2 text-xs font-semibold text-primary-foreground shadow-soft hover:bg-primary/90"\n          >\n            <MapPinned className="h-3.5 w-3.5" /> Find another property\n          </Link>'''
          dashboard_new = '''          <div className="flex flex-wrap gap-2">\n            <Link\n              to="/orders"\n              className="inline-flex items-center gap-1.5 rounded-full border border-border bg-card px-4 py-2 text-xs font-semibold text-foreground shadow-soft hover:bg-muted"\n            >\n              <FileText className="h-3.5 w-3.5" /> My Reports\n            </Link>\n            <Link\n              to="/"\n              className="inline-flex items-center gap-1.5 rounded-full bg-primary px-4 py-2 text-xs font-semibold text-primary-foreground shadow-soft hover:bg-primary/90"\n            >\n              <MapPinned className="h-3.5 w-3.5" /> Find another property\n            </Link>\n          </div>'''
          replace_once("src/routes/dashboard.tsx", dashboard_old, dashboard_new)

          admin_old = '''          <Link\n            to="/dashboard"\n            className="inline-flex items-center gap-1.5 rounded-full border border-border bg-card px-4 py-2 text-xs font-semibold text-foreground shadow-soft hover:bg-muted"\n          >\n            My Investigations <ArrowRight className="h-3.5 w-3.5" />\n          </Link>'''
          admin_new = '''          <div className="flex flex-wrap gap-2">\n            <Link\n              to="/admin/fulfillment"\n              className="inline-flex items-center gap-1.5 rounded-full bg-primary px-4 py-2 text-xs font-semibold text-primary-foreground shadow-soft hover:bg-primary/90"\n            >\n              <ReceiptText className="h-3.5 w-3.5" /> Human-review fulfillment\n            </Link>\n            <Link\n              to="/dashboard"\n              className="inline-flex items-center gap-1.5 rounded-full border border-border bg-card px-4 py-2 text-xs font-semibold text-foreground shadow-soft hover:bg-muted"\n            >\n              My Investigations <ArrowRight className="h-3.5 w-3.5" />\n            </Link>\n          </div>'''
          replace_once("src/routes/admin.tsx", admin_old, admin_new)
          PY
          git diff --check
          git config user.name "Easy Erf CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/dashboard.tsx src/routes/admin.tsx
          git commit -m "Make R999 reviews and reports discoverable"
          git push origin "HEAD:${HEAD_REF}"
