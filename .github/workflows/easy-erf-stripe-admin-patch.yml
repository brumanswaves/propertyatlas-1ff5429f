name: Apply Easy Erf Stripe admin patch

on:
  push:
    branches:
      - chatgpt/easy-erf-stripe-fulfillment
    paths:
      - .github/workflows/easy-erf-stripe-admin-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch with built-in Git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Apply exact Founder Operations replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/admin.tsx")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "  user_id: string;\n  parcel_id: string;",
                  "  user_id: string | null;\n  parcel_id: string | null;",
              ),
              (
                  "  provider_id: string | null;\n  price_cents: number;",
                  "  provider_id: string | null;\n  provider: string;\n  payload: unknown;\n  price_cents: number;",
              ),
              (
                  '"id,user_id,parcel_id,report_type,status,status_enum,provider_id,price_cents,created_at,updated_at,failure_reason,completed_at",',
                  '"id,user_id,parcel_id,report_type,status,status_enum,provider_id,provider,payload,price_cents,created_at,updated_at,failure_reason,completed_at",',
              ),
              (
                  "    for (const order of orders) users.add(order.user_id);",
                  "    for (const order of orders) if (order.user_id) users.add(order.user_id);",
              ),
              (
                  '            title="Report orders"\n            description="Recent order records already available to admins through the existing report-order policy."',
                  '            title="Investigation and report orders"\n            description="Read-only payment and fulfilment truth from the secured order ledger."',
              ),
              (
                  "                          {order.parcel_id}\n",
                  '                          {order.parcel_id ??\n                            orderPayloadText(order, "propertyReference") ??\n                            "Property reference pending"}\n',
              ),
              (
                  "                          {shortId(order.user_id)}\n",
                  '                          {order.user_id\n                            ? shortId(order.user_id)\n                            : orderPayloadText(order, "customerEmail") ?? "Unmatched"}\n',
              ),
              (
                  '                        <td className="px-4 py-3">{order.provider_id ?? "Not recorded"}</td>',
                  '                        <td className="px-4 py-3">\n                          {readableLabel(order.provider || order.provider_id || "Not recorded")}\n                        </td>',
              ),
              (
                  "function orderStatus(order: ReportOrderRow) {",
                  '''function orderPayloadText(order: ReportOrderRow, key: string) {
  if (!order.payload || typeof order.payload !== "object" || Array.isArray(order.payload)) {
    return null;
  }
  const value = (order.payload as Record<string, unknown>)[key];
  return typeof value === "string" && value.trim() ? value.trim() : null;
}

function orderStatus(order: ReportOrderRow) {''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old[:90]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/easy-erf-stripe-admin-patch.yml").unlink()
          PY

      - name: Commit exact patch and remove helper
        run: |
          git config user.name "Easy Erf CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/admin.tsx .github/workflows/easy-erf-stripe-admin-patch.yml
          git diff --cached --check
          git commit -m "Show Stripe investigation orders safely in Founder Operations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
