name: Verify founder frontend cutover

on:
  push:
    branches:
      - codex/founder-frontend-cutover-config
    paths:
      - .github/workflows/verify-founder-frontend-cutover.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/founder-frontend-cutover-config
          fetch-depth: 0

      - name: Probe founder Google OAuth readiness
        run: |
          set -a
          source .env
          set +a
          node <<'NODE'
          const url = new URL('/auth/v1/authorize', process.env.SUPABASE_URL)
          url.searchParams.set('provider', 'google')
          url.searchParams.set('redirect_to', 'https://easyerf.lovable.app')
          const response = await fetch(url, {
            headers: { apikey: process.env.SUPABASE_PUBLISHABLE_KEY },
            redirect: 'manual',
          })
          const location = response.headers.get('location') || ''
          const ready = response.status >= 300 && response.status < 400 && location.startsWith('https://accounts.google.com/')
          console.log(`Google OAuth readiness: ${ready ? 'READY' : `NOT_READY (HTTP ${response.status})`}`)
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run founder cutover tests
        run: >-
          npx vitest run
          src/lib/auth/__tests__/googleAuthTransport.test.ts
          src/lib/auth/__tests__/founderFrontendCutoverConfig.test.ts
          src/lib/sitePotential/__tests__/sitePotentialApiClient.test.ts
          src/lib/sitePotential/__tests__/sitePotentialEdgeApi.test.ts

      - name: Run full test suite
        run: npx vitest run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run targeted ESLint
        run: >-
          npx eslint
          --rule 'prettier/prettier: off'
          src/routes/auth.tsx
          src/lib/auth/googleAuthTransport.ts
          src/lib/auth/__tests__/googleAuthTransport.test.ts
          src/lib/auth/__tests__/founderFrontendCutoverConfig.test.ts
          src/integrations/supabase/client.ts

      - name: Build production bundle
        run: npm run build

      - name: Check stacked patch whitespace
        run: git diff --check a83dc3764f0cb84c515b95289603a53ae9a0140c HEAD

# One-time stacked verification workflow. Remove after the branch is green.
