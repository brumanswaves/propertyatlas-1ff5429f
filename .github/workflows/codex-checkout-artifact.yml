name: Codex checkout artifact

on:
  push:
    branches:
      - site-potential-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: easy-erf-source
          path: .
          include-hidden-files: true
          retention-days: 1
