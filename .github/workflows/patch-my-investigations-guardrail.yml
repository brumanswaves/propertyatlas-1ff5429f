name: Patch My Investigations guardrail

on:
  push:
    branches:
      - codex/my-investigations-durable-dashboard

permissions:
  contents: write

jobs:
  patch-guardrail:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/my-investigations-durable-dashboard
          fetch-depth: 0
      - name: Replace stale dashboard source assertion
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/property/__tests__/dossierUx.test.ts')
          source = path.read_text()
          pattern = re.compile(
              r'  it\("hides empty market evidence/calculator dashboard sections and keeps run calculator action", \(\) => \{.*?^  \}\);',
              re.MULTILINE | re.DOTALL,
          )
          replacement = '''  it("keeps My Investigations market evidence conditional and routes property work into canonical surfaces", () => {
            const dashboard = read("src/routes/dashboard.tsx");

            expect(dashboard).toContain("marketEvidence.length > 0");
            expect(dashboard).not.toContain("No listing evidence saved yet");
            expect(dashboard).not.toContain("Calculators live inside each property dossier");
            expect(dashboard).not.toContain("Run calculator");
            expect(dashboard).not.toContain("tab=calc");
            expect(dashboard).toContain("Continue Investigation");
            expect(dashboard).toContain('withTab(href, "investigation")');
            expect(dashboard).toContain('withTab(href, "stoep-report")');
          });'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale guardrail block, found {count}')
          path.write_text(updated)
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-my-investigations-guardrail.yml
      - name: Commit branch-only guardrail update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/property/__tests__/dossierUx.test.ts .github/workflows/patch-my-investigations-guardrail.yml
          git commit -m "Update dashboard UX guardrail for My Investigations"
          git push origin HEAD:codex/my-investigations-durable-dashboard
