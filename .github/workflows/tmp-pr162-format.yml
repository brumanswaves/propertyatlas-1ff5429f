name: Temporary PR 162 formatter

on:
  push:
    branches:
      - chatgpt/ee-r999-customer-notification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ee-r999-customer-notification
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format the three verified lint failures
        run: |
          npx prettier --write \
            src/components/admin/FounderCustomerNotification.tsx \
            src/components/admin/FounderHumanReviewEditor.tsx \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts

      - name: Verify targeted lint after formatting
        run: |
          npx eslint \
            src/components/admin/FounderCustomerNotification.tsx \
            src/components/admin/FounderHumanReviewEditor.tsx \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts

      - name: Commit only the formatted source files
        run: |
          git config user.name "TuismoreAI"
          git config user.email "brumanswaves@gmail.com"
          git add \
            src/components/admin/FounderCustomerNotification.tsx \
            src/components/admin/FounderHumanReviewEditor.tsx \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes were produced."
            exit 1
          fi
          git commit -m "style: format customer notification source"
          git push origin HEAD:chatgpt/ee-r999-customer-notification
