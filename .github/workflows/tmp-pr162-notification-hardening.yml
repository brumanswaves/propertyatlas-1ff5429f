name: Temporary PR 162 notification hardening

on:
  push:
    branches:
      - chatgpt/ee-r999-customer-notification

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ee-r999-customer-notification
          fetch-depth: 0

      - name: Apply bounded notification hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(*lines: str) -> str:
              return "\n".join(lines)

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one match in {path}, found {count}: {old[:100]!r}"
                  )
              file_path.write_text(text.replace(old, new, 1))

          function_path = "supabase/functions/easy-erf-founder-customer-notification/index.ts"
          replace_once(
              function_path,
              block(
                  "function cleanText(value: unknown): string | null {",
                  '  return typeof value === "string" && value.trim() ? value.trim() : null;',
                  "}",
              ),
              block(
                  "function cleanText(value: unknown): string | null {",
                  '  return typeof value === "string" && value.trim() ? value.trim() : null;',
                  "}",
                  "",
                  "function cleanSingleLine(value: unknown, maxLength: number): string | null {",
                  r'  const cleaned = cleanText(value)?.replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim();',
                  "  return cleaned ? cleaned.slice(0, maxLength) : null;",
                  "}",
              ),
          )
          replace_once(
              function_path,
              block(
                  "  const customerName = cleanText(payload.customerName) ?? cleanText(customer.user_metadata?.full_name);",
                  '  const propertyReference = cleanText(payload.propertyReference) ?? cleanText(order.parcel_id) ?? "your property";',
              ),
              block(
                  "  const customerName =",
                  "    cleanSingleLine(payload.customerName, 120) ??",
                  "    cleanSingleLine(customer.user_metadata?.full_name, 120);",
                  "  const propertyReference =",
                  "    cleanSingleLine(payload.propertyReference, 240) ??",
                  "    cleanSingleLine(order.parcel_id, 240) ??",
                  '    "your property";',
              ),
          )
          replace_once(
              function_path,
              '  if (body.confirmation !== RECORD_CONFIRMATION) {',
              block(
                  "  const preparedRecipient = cleanText(body.recipient)?.toLowerCase() ?? null;",
                  "  if (preparedRecipient !== draft.recipient.toLowerCase()) {",
                  "    return json(",
                  "      {",
                  "        ok: false,",
                  '        code: "RECIPIENT_CHANGED",',
                  "        error:",
                  '          "Prepared email recipient no longer matches the order customer. Prepare the email again.",',
                  "        requestId,",
                  "      },",
                  "      409,",
                  "    );",
                  "  }",
                  "",
                  '  if (body.confirmation !== RECORD_CONFIRMATION) {',
              ),
          )

          ui_path = "src/components/admin/FounderCustomerNotification.tsx"
          replace_once(
              ui_path,
              block(
                  "  useEffect(() => {",
                  "    setReceipt(receiptFromContent);",
                  "  }, [receiptFromContent]);",
                  "",
                  "  if (!available) return null;",
              ),
              block(
                  "  useEffect(() => {",
                  "    setReceipt(receiptFromContent);",
                  "  }, [receiptFromContent]);",
                  "",
                  "  useEffect(() => {",
                  "    setDraft(null);",
                  "    setConfirmedSent(false);",
                  "  }, [orderId]);",
                  "",
                  "  if (!available) return null;",
              ),
          )
          replace_once(
              ui_path,
              "    setDraft(preparedDraft);",
              block(
                  "    setDraft(preparedDraft);",
                  "    setConfirmedSent(false);",
              ),
          )
          replace_once(
              ui_path,
              "    await navigator.clipboard.writeText(",
              block(
                  "    try {",
                  "      await navigator.clipboard.writeText(",
              ),
          )
          replace_once(
              ui_path,
              '    toast.success("Customer email copied");',
              block(
                  '      toast.success("Customer email copied");',
                  "    } catch {",
                  '      toast.error("The email could not be copied. Select and copy the text manually.");',
                  "    }",
              ),
          )
          replace_once(
              ui_path,
              "          confirmation: RECORD_CONFIRMATION,",
              block(
                  "          confirmation: RECORD_CONFIRMATION,",
                  "          recipient: draft.recipient,",
              ),
          )
          replace_once(
              ui_path,
              "    if (error || !data?.ok || !recordedReceipt) {",
              block(
                  "    if (error || !data?.ok || !recordedReceipt) {",
                  '      if (data?.code === "RECIPIENT_CHANGED") {',
                  "        setDraft(null);",
                  "        setConfirmedSent(false);",
                  "      }",
              ),
          )
          replace_once(
              ui_path,
              "    setReceipt(recordedReceipt);",
              block(
                  "    setReceipt(recordedReceipt);",
                  "    setDraft(null);",
              ),
          )

          migration_path = "supabase/migrations/20260903211000_record_manual_report_notification.sql"
          replace_once(
              migration_path,
              block(
                  "  if nullif(lower(btrim(coalesce(p_recipient_email, ''))), '') is null then",
                  "    raise exception 'Customer email is required';",
                  "  end if;",
                  "",
                  "  select * into v_order",
              ),
              block(
                  "  if nullif(lower(btrim(coalesce(p_recipient_email, ''))), '') is null then",
                  "    raise exception 'Customer email is required';",
                  "  end if;",
                  "  if public.has_role(p_actor_user_id, 'admin'::public.app_role) is not true then",
                  "    raise exception 'Founder actor must have admin role';",
                  "  end if;",
                  "",
                  "  select * into v_order",
              ),
          )
          replace_once(
              migration_path,
              "  if v_order.provider <> 'stripe'",
              "  if v_order.provider is distinct from 'stripe'",
          )
          replace_once(
              migration_path,
              "  if v_status <> 'ready' then",
              "  if v_status is distinct from 'ready' then",
          )
          replace_once(
              migration_path,
              block(
                  "  if jsonb_typeof(v_existing_notification) = 'object'",
                  "     and v_existing_notification ->> 'status' = 'sent'",
                  "     and lower(coalesce(v_existing_notification ->> 'recipient', '')) = v_expected_email",
                  "     and nullif(v_existing_notification ->> 'sentAt', '') is not null then",
              ),
              block(
                  "  if jsonb_typeof(v_existing_notification) = 'object'",
                  "     and v_existing_notification ->> 'status' = 'sent'",
                  "     and v_existing_notification ->> 'channel' = 'manual_email'",
                  "     and lower(coalesce(v_existing_notification ->> 'recipient', '')) = v_expected_email",
                  "     and nullif(v_existing_notification ->> 'sentAt', '') is not null",
                  "     and nullif(v_existing_notification ->> 'sentBy', '') is not null then",
              ),
          )

          proof_path = "scripts/verify-easy-erf-customer-notification.sql"
          replace_once(
              proof_path,
              r"\i supabase/migrations/20260903211000_record_manual_report_notification.sql",
              block(
                  "create or replace function public.has_role(_user_id uuid, _role public.app_role)",
                  "returns boolean",
                  "language sql",
                  "stable",
                  "security definer",
                  "set search_path = public",
                  "as $$",
                  "  select _user_id = '11111111-1111-4111-8111-111111111111'::uuid",
                  "    and _role = 'admin'::public.app_role",
                  "$$;",
                  "",
                  r"\i supabase/migrations/20260903211000_record_manual_report_notification.sql",
              ),
          )
          wrong_recipient_block = block(
              "  begin",
              "    perform public.record_easy_erf_customer_notification(",
              "      v_order_id,",
              "      v_actor_id,",
              "      'wrong-customer@example.com'",
              "    );",
          )
          replace_once(
              proof_path,
              wrong_recipient_block,
              block(
                  "  begin",
                  "    perform public.record_easy_erf_customer_notification(",
                  "      v_order_id,",
                  "      v_customer_id,",
                  "      'customer@example.com'",
                  "    );",
                  "    raise exception 'Notification accepted a non-admin actor';",
                  "  exception",
                  "    when others then",
                  "      if sqlerrm = 'Notification accepted a non-admin actor' then raise; end if;",
                  "      if sqlerrm not like '%Founder actor must have admin role%' then",
                  "        raise exception 'Unexpected non-admin actor error: %', sqlerrm;",
                  "      end if;",
                  "  end;",
                  "",
                  "  update public.report_orders",
                  "  set review_content = jsonb_set(",
                  "    review_content,",
                  "    '{customerNotification}',",
                  "    jsonb_build_object(",
                  "      'status', 'sent',",
                  "      'channel', 'sms',",
                  "      'recipient', 'customer@example.com',",
                  "      'sentAt', '2026-09-04T00:00:00.000Z',",
                  "      'sentBy', v_actor_id::text",
                  "    ),",
                  "    true",
                  "  )",
                  "  where id = v_order_id;",
                  "",
                  wrong_recipient_block,
              ),
          )

          test_path = "src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts"
          replace_once(
              test_path,
              r"    expect(notificationFunction).not.toMatch(/fetch\s*\(/);",
              block(
                  r"    expect(notificationFunction).not.toMatch(/fetch\s*\(/);",
                  '    expect(notificationFunction).toContain("cleanSingleLine(payload.customerName, 120)");',
                  '    expect(notificationFunction).toContain("cleanSingleLine(payload.propertyReference, 240)");',
                  '    expect(notificationUi).toContain("The email could not be copied");',
              ),
          )
          replace_once(
              test_path,
              "    expect(notificationFunction).toContain('\\\"record_easy_erf_customer_notification\\\"');",
              block(
                  "    expect(notificationFunction).toContain('\\\"record_easy_erf_customer_notification\\\"');",
                  '    expect(notificationFunction).toContain("cleanText(body.recipient)?.toLowerCase()");',
                  '    expect(notificationFunction).toContain("RECIPIENT_CHANGED");',
                  '    expect(notificationFunction).toContain("Prepare the email again.");',
                  '    expect(notificationUi).toContain("recipient: draft.recipient");',
              ),
          )
          replace_once(
              test_path,
              '  it("accepts only a ready Easy Erf order and its canonical customer email", () => {',
              block(
                  '  it("accepts only a ready Easy Erf order and its canonical customer email", () => {',
                  '    expect(notificationMigration).toContain("public.has_role(p_actor_user_id");',
                  '    expect(notificationMigration).toContain("Founder actor must have admin role");',
                  '    expect(notificationMigration).toContain("v_order.provider is distinct from \'stripe\'");',
                  '    expect(notificationMigration).toContain("v_status is distinct from \'ready\'");',
              ),
          )
          replace_once(
              test_path,
              '    expect(notificationMigration).toContain("v_existing_notification ->> \'status\' = \'sent\'");',
              block(
                  '    expect(notificationMigration).toContain("v_existing_notification ->> \'status\' = \'sent\'");',
                  "    expect(notificationMigration).toContain(\"v_existing_notification ->> 'channel' = 'manual_email'\");",
                  "    expect(notificationMigration).toContain(\"nullif(v_existing_notification ->> 'sentBy', '') is not null\");",
              ),
          )
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format and verify targeted source
        run: |
          npx prettier --write \
            supabase/functions/easy-erf-founder-customer-notification/index.ts \
            src/components/admin/FounderCustomerNotification.tsx \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts
          npx eslint \
            src/components/admin/FounderCustomerNotification.tsx \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts
          npx vitest run src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts

      - name: Type-check notification function with verified Deno
        run: |
          curl --fail --location --silent --show-error \
            --output deno.zip \
            https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-unknown-linux-gnu.zip
          echo "394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2  deno.zip" | sha256sum --check
          unzip -q deno.zip
          ./deno check --node-modules-dir=auto --no-lock supabase/functions/easy-erf-founder-customer-notification/index.ts

      - name: Prove hardened notification database contract
        env:
          PGPASSWORD: postgres
        run: >-
          psql
          --host 127.0.0.1
          --port 54329
          --username postgres
          --dbname postgres
          --file scripts/verify-easy-erf-customer-notification.sql

      - name: Commit bounded hardening and remove temporary workflow
        run: |
          git config user.name "TuismoreAI"
          git config user.email "brumanswaves@gmail.com"
          git rm .github/workflows/tmp-pr162-notification-hardening.yml
          git add \
            supabase/functions/easy-erf-founder-customer-notification/index.ts \
            src/components/admin/FounderCustomerNotification.tsx \
            supabase/migrations/20260903211000_record_manual_report_notification.sql \
            scripts/verify-easy-erf-customer-notification.sql \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts
          printf '%s\n' \
            .github/workflows/tmp-pr162-notification-hardening.yml \
            scripts/verify-easy-erf-customer-notification.sql \
            src/components/admin/FounderCustomerNotification.tsx \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts \
            supabase/functions/easy-erf-founder-customer-notification/index.ts \
            supabase/migrations/20260903211000_record_manual_report_notification.sql \
            | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --cached --check
          git commit -m "fix: harden manual notification receipt integrity"
          git push origin HEAD:chatgpt/ee-r999-customer-notification
