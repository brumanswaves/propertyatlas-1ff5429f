name: Guided integration verification

on:
  push:
    branches:
      - chatgpt/ee-r999-customer-notification
    paths:
      - .github/workflows/guided-integration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply bounded migration inventory repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=20 origin chatgpt/ee-r999-customer-notification
          git checkout -b chatgpt/ee-r999-customer-notification FETCH_HEAD
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^)" = "65d2d031b350d7e24084d4384982c7a9959309ef"
          test "$(grep -c 'expect(migrationNames).toHaveLength(36);' src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts)" = "1"
          test "$(grep -c '20260903111500_require_resolved_founder_investigation_checklist.sql' src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts)" = "1"
          sed -i 's/expect(migrationNames)\.toHaveLength(36);/expect(migrationNames).toHaveLength(37);/' src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts
          sed -i '/"20260903111500_require_resolved_founder_investigation_checklist.sql",/a\      "20260903211000_record_manual_report_notification.sql",' src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts
          test "$(grep -c 'expect(migrationNames).toHaveLength(37);' src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts)" = "1"
          test "$(grep -c '20260903211000_record_manual_report_notification.sql' src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts)" = "1"
          git checkout origin/main -- .github/workflows/guided-integration.yml
          rm -f .github/workflows/ee-r999-ci-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: include notification migration in canonical inventory"
          git push origin HEAD:chatgpt/ee-r999-customer-notification
