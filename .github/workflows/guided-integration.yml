name: Guided integration verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guided-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository with built-in Git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch --no-tags --depth=1 origin "${REF}"
          git checkout --detach FETCH_HEAD
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Confirm built-in Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run focused Guided tests
        run: >-
          npx vitest run
          src/features/marketEvidence/__tests__/addressSuggestions.test.ts
          src/lib/workbench/__tests__/sgDenseGeneralPlan.test.ts
          src/lib/investigation/__tests__/guidedJourney.test.ts
          src/components/property/investigation/__tests__/guidedComponents.test.tsx
          src/components/property/investigation/__tests__/guidedVaultEvidenceSteps.test.tsx
          src/components/property/investigation/__tests__/guidedZoningStep.test.tsx
          src/components/property/investigation/__tests__/guidedPropertyChecksStep.test.tsx
          src/components/property/investigation/__tests__/guidedMarketEvidenceStep.test.tsx
          src/components/property/investigation/__tests__/guidedReportStep.test.tsx

      - name: Run full test suite
        run: npx vitest run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run targeted ESLint
        run: >-
          npx eslint
          --no-warn-ignored
          src/components/property/investigation/AddAddressStep.tsx
          src/components/property/investigation/GuidedSitePotentialStep.tsx
          src/components/property/investigation/GuidedTitleStep.tsx
          src/components/property/investigation/GuidedZoningStep.tsx
          src/components/property/investigation/InvestigationJourney.tsx
          src/components/property/investigation/InvestigationStepShell.tsx
          src/components/property/investigation/__tests__/guidedMarketEvidenceStep.test.tsx
          src/components/property/investigation/__tests__/guidedPropertyChecksStep.test.tsx
          src/components/property/investigation/__tests__/guidedReportStep.test.tsx
          src/components/property/investigation/__tests__/guidedVaultEvidenceSteps.test.tsx
          src/components/property/investigation/__tests__/guidedZoningStep.test.tsx
          src/features/marketEvidence/addressIntelligence.ts
          src/features/marketEvidence/hooks/useAddressSuggestions.ts
          src/features/marketEvidence/types.ts
          src/features/marketEvidence/__tests__/addressSuggestions.test.ts
          src/lib/investigation/guidedJourney.ts
          src/lib/investigation/__tests__/guidedJourney.test.ts
          src/lib/workbench/__tests__/sgDenseGeneralPlan.test.ts
          supabase/functions/_shared/erfExtractionMedia.ts
          supabase/functions/_shared/generalPlanSubjectEvidence.ts
          supabase/functions/extract-erf-asset/index.ts
          supabase/functions/extract-erf-asset/tiffDecode.ts

      - name: Build production bundle
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
