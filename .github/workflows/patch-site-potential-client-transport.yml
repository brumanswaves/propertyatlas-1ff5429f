name: Patch Site Potential client transport

on:
  push:
    branches:
      - codex/founder-site-potential-client-transport
    paths:
      - .github/workflows/patch-site-potential-client-transport.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/founder-site-potential-client-transport
          fetch-depth: 0

      - name: Patch SitePotentialTab
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/property/dossier/SitePotentialTab.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import { createSitePotentialPackStatusPoller } from "@/lib/sitePotential/packStatusPolling";\n',
                  'import { createSitePotentialPackStatusPoller } from "@/lib/sitePotential/packStatusPolling";\nimport { fetchSitePotentialApi } from "@/lib/sitePotential/sitePotentialApiClient";\n',
              ),
              (
                  '''      const response = await fetch(`/api/site-potential/pack-status?${params.toString()}`, {\n        headers: { Authorization: `Bearer ${token}` },\n        signal,\n      });''',
                  '''      const response = await fetchSitePotentialApi({\n        route: "pack-status",\n        token,\n        searchParams: params,\n        init: { signal },\n      });''',
              ),
              (
                  '''      const response = await fetch("/api/site-potential/retry-pack", {\n        method: "POST",\n        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },\n        body: JSON.stringify({\n          parcelId: parcel.id,\n          siteProjectId: project.id,\n          designPackId: packStatus.designPackId,\n        }),\n      });''',
                  '''      const response = await fetchSitePotentialApi({\n        route: "retry-pack",\n        token,\n        init: {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({\n            parcelId: parcel.id,\n            siteProjectId: project.id,\n            designPackId: packStatus.designPackId,\n          }),\n        },\n      });''',
              ),
              (
                  '''      const response = await fetch("/api/site-potential/beta-redeem", {\n        method: "POST",\n        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },\n        body: JSON.stringify({\n          parcelId: parcel.id,\n          siteProjectId: current.id,\n          requestId: crypto.randomUUID(),\n        }),\n      });''',
                  '''      const response = await fetchSitePotentialApi({\n        route: "beta-redeem",\n        token,\n        init: {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({\n            parcelId: parcel.id,\n            siteProjectId: current.id,\n            requestId: crypto.randomUUID(),\n          }),\n        },\n      });''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:90]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/property/dossier/SitePotentialTab.tsx
          git diff --cached --check
          git commit -m "Route Site Potential beta controls through transport"
          git push origin HEAD:codex/founder-site-potential-client-transport
