name: Fix Kouga RES1 regression assertions

on:
  push:
    branches:
      - codex/kouga-res1-official-scheme-evidence
    paths:
      - .github/workflows/fix-kouga-res1-regressions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kouga-res1-official-scheme-evidence
      - name: Update precise regression assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          job_test = Path('src/lib/investigation/__tests__/planningInvestigationJob.test.ts')
          text = job_test.read_text()
          old = 'finding.kind === "published_rule" && finding.label.includes("Coverage"),'
          new = 'finding.kind === "published_rule" && finding.label.toLowerCase().includes("coverage"),'
          if old not in text:
              raise SystemExit('planning job coverage assertion marker not found')
          job_test.write_text(text.replace(old, new, 1))

          report_test = Path('src/lib/reports/__tests__/buildReportViewModel.test.ts')
          text = report_test.read_text()
          old = 'value: "Residential Zone 1 (single residential)",'
          new = 'value: "Residential Zone 1",'
          if old not in text:
              raise SystemExit('report zoning display assertion marker not found')
          report_test.write_text(text.replace(old, new, 1))
          PY
      - name: Commit assertion updates
        shell: bash
        run: |
          git config user.name "TuismoreAI"
          git config user.email "brumanswaves@gmail.com"
          git add src/lib/investigation/__tests__/planningInvestigationJob.test.ts src/lib/reports/__tests__/buildReportViewModel.test.ts
          git diff --cached --check
          git commit -m "Align planning regressions with verified RES1 source"
          git push origin HEAD:codex/kouga-res1-official-scheme-evidence
