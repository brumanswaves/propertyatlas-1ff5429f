name: Human Review UX repair

on:
  push:
    branches:
      - chatgpt/fix-human-review-ux
    paths:
      - .github/workflows/human-review-ux-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Apply coherent Human Review repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: chatgpt/fix-human-review-ux
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=50 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
          npx --yes supabase@latest migration new reopen_easy_erf_human_review
          MIGRATION_PATH="$(find supabase/migrations -maxdepth 1 -type f -name '*_reopen_easy_erf_human_review.sql' | sort | tail -1)"
          test -n "${MIGRATION_PATH}"
          export MIGRATION_PATH
          python scripts/human-review-ux-repair.py
          git diff --check
          git config user.name "Easy Erf CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Human Review journey and founder report editing"
          git push origin "HEAD:${HEAD_REF}"
