name: Final Human Review copy alignment

on:
  push:
    branches:
      - chatgpt/human-review-product-v2
    paths:
      - .github/workflows/final-human-review-copy-alignment.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Align scope guardrail and remove temporary workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: chatgpt/human-review-product-v2
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=100 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          p = Path("src/lib/payments/__tests__/easyErfHumanReviewScopeGuardrails.test.ts")
          s = p.read_text()
          old = 'expect(pricing).toContain("does NOT invent a quote/per-m² cost estimate");'
          new = 'expect(pricing).toContain("does not invent a construction quotation or per-m² build-cost estimate");'
          if s.count(old) != 1:
              raise SystemExit(f"scope copy guardrail anchor mismatch: {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY
          git rm -f .github/workflows/lock-human-review-commercial-copy.yml
          git rm -f .github/workflows/final-human-review-copy-alignment.yml
          git diff --check
          git config user.name "Easy Erf CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/payments/__tests__/easyErfHumanReviewScopeGuardrails.test.ts
          git commit -m "Align controlled Human Review product truth"
          git push origin "HEAD:${HEAD_REF}"
