name: PR 141 migration inventory repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr141-migration-inventory-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Repair exact migration inventory expectation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=20 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts")
          text = path.read_text()

          old_count = "expect(migrationNames).toHaveLength(31);"
          new_count = "expect(migrationNames).toHaveLength(32);"
          if text.count(old_count) != 1:
              raise SystemExit(f"Expected exactly one old migration count, found {text.count(old_count)}")
          text = text.replace(old_count, new_count, 1)

          anchor = '      "20260831090000_easy_erf_founder_fulfillment_controls.sql",\n'
          addition = anchor + '      "20260831113000_secure_easy_erf_report_delivery.sql",\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one founder migration anchor, found {text.count(anchor)}")
          if "20260831113000_secure_easy_erf_report_delivery.sql" in text:
              raise SystemExit("Delivery migration already present; refusing duplicate edit")
          text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts
          git config user.name "Easy Erf CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts
          git commit -m "Update migration inventory for secure report delivery"
          git push origin "HEAD:${HEAD_REF}"
