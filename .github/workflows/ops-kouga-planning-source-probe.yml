name: Probe Kouga planning sources

on:
  push:
    branches:
      - ops/kouga-planning-source-probe
    paths:
      - .github/workflows/ops-kouga-planning-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact canonical SG match in municipal parcel report
        run: |
          python <<'PY'
          import datetime
          import json
          import urllib.parse
          import urllib.request

          service = "https://services6.arcgis.com/HrQQGPZkIr5BuMyY/ArcGIS/rest/services/Land_Parcel_Property_Report_Developed/FeatureServer"
          layer = service + "/0"
          canonical_sg = "C03400140000157000000"

          def get_json(url):
              with urllib.request.urlopen(url, timeout=30) as response:
                  return json.load(response)

          service_meta = get_json(service + "?f=json")
          layer_meta = get_json(layer + "?f=json")
          print("SERVICE_ITEM_ID", service_meta.get("serviceItemId"))
          print("SERVICE_DESCRIPTION", (service_meta.get("serviceDescription") or "").replace("\n", " ")[:1000])
          editing = layer_meta.get("editingInfo") or {}
          last_edit = editing.get("lastEditDate")
          if last_edit:
              print("LAST_EDIT_MS", last_edit)
              print("LAST_EDIT_UTC", datetime.datetime.fromtimestamp(last_edit/1000, datetime.timezone.utc).isoformat())
          print("FEATURE_COUNT_ESTIMATE", layer_meta.get("maxRecordCount"))

          def query(where):
              params = {
                  "where": where,
                  "outFields": "F0SGNumber,F1ErfFarmAr,F2ErfFarmNu,F3Portion,F4Address,F11ExtentSQ,F12LandUsag,F13ZoningSc,F14Zoning,F15ZoningFi,UDZoning,UDIssue,UDAreaSQM,UDSplitZn,SG_NUMBER,SUBURB,TOWN,ERF,PORTION_SECTION",
                  "returnGeometry": "false",
                  "f": "json",
              }
              return get_json(layer + "/query?" + urllib.parse.urlencode(params))

          for field in ["F0SGNumber", "SG_NUMBER"]:
              data = query(f"{field} = '{canonical_sg}'")
              print("EXACT_QUERY", field, "COUNT", len(data.get("features", [])), "ERROR", data.get("error"))
              for feature in data.get("features", []):
                  print("EXACT_MATCH", json.dumps(feature.get("attributes", {}), sort_keys=True, default=str))

          # Also prove the exact CSG parcel exists in Kouga's SG layer so absence
          # from the developed-property report can be classified correctly.
          sg_layer = "https://services6.arcgis.com/HrQQGPZkIr5BuMyY/ArcGIS/rest/services/Kouga_SG_Properties/FeatureServer/32"
          sg_params = {
              "where": f"DSG_NO = '{canonical_sg}'",
              "outFields": "DSG_NO,PRCL_KEY,GEOM_AREA,MIN_REGION,MAJ_REGION,PARCEL_NO,PORTION",
              "returnGeometry": "false",
              "f": "json",
          }
          sg_data = get_json(sg_layer + "/query?" + urllib.parse.urlencode(sg_params))
          print("SG_LAYER_EXACT_COUNT", len(sg_data.get("features", [])), "ERROR", sg_data.get("error"))
          for feature in sg_data.get("features", []):
              print("SG_LAYER_MATCH", json.dumps(feature.get("attributes", {}), sort_keys=True, default=str))
          PY

      - name: Verify direct official document downloads
        run: |
          python <<'PY'
          import hashlib
          import urllib.request

          targets = {
              "scheme": "https://www.kouga.gov.za/download/4539",
              "st_francis_zoning_plan": "https://www.kouga.gov.za/download/4531",
          }
          for label, url in targets.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 EasyErfSourceProbe/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  print("DOWNLOAD", label)
                  print("  FINAL_URL", response.geturl())
                  print("  CONTENT_TYPE", response.headers.get("Content-Type"))
                  print("  CONTENT_DISPOSITION", response.headers.get("Content-Disposition"))
                  print("  BYTES", len(data))
                  print("  SHA256", hashlib.sha256(data).hexdigest())
                  print("  PDF_MAGIC", data[:5] == b"%PDF-")
          PY
