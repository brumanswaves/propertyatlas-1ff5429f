name: Probe Kouga planning sources

on:
  push:
    branches:
      - ops/kouga-planning-source-probe
    paths:
      - .github/workflows/ops-kouga-planning-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Query Kouga parcel report for canonical Erf 1570
        run: |
          python <<'PY'
          import json
          import urllib.parse
          import urllib.request

          layer = "https://services6.arcgis.com/HrQQGPZkIr5BuMyY/ArcGIS/rest/services/Land_Parcel_Property_Report_Developed/FeatureServer/0"

          def get_json(url):
              with urllib.request.urlopen(url, timeout=30) as response:
                  return json.load(response)

          meta = get_json(layer + "?f=json")
          print("LAYER_NAME", meta.get("name"))
          for field in meta.get("fields", []):
              if field.get("name") in {
                  "F0SGNumber", "F1ErfFarmAr", "F2ErfFarmNu", "F3Portion", "F4Address",
                  "F11ExtentSQ", "F12LandUsag", "F13ZoningSc", "F14Zoning", "F15ZoningFi",
                  "UDZoning", "UDIssue", "UDAreaSQM", "UDSplitZn", "SG_NUMBER", "SUBURB",
                  "TOWN", "ERF", "PORTION_SECTION"
              }:
                  print("FIELD", field.get("name"), "ALIAS", field.get("alias"), "TYPE", field.get("type"))

          def query(where):
              params = {
                  "where": where,
                  "outFields": "F0SGNumber,F1ErfFarmAr,F2ErfFarmNu,F3Portion,F4Address,F11ExtentSQ,F12LandUsag,F13ZoningSc,F14Zoning,F15ZoningFi,UDZoning,UDIssue,UDAreaSQM,UDSplitZn,SG_NUMBER,SUBURB,TOWN,ERF,PORTION_SECTION",
                  "returnGeometry": "false",
                  "f": "json",
              }
              url = layer + "/query?" + urllib.parse.urlencode(params)
              return get_json(url)

          queries = [
              "ERF = '1570'",
              "F2ErfFarmNu = '1570'",
              "ERF = '1570' AND PORTION_SECTION IN ('0','00000','')",
              "F0SGNumber LIKE '%1570%'",
              "SG_NUMBER LIKE '%1570%'",
          ]
          seen = set()
          for where in queries:
              data = query(where)
              print("QUERY", where, "COUNT", len(data.get("features", [])), "ERROR", data.get("error"))
              for feature in data.get("features", []):
                  attrs = feature.get("attributes", {})
                  identity = json.dumps(attrs, sort_keys=True, default=str)
                  if identity in seen:
                      continue
                  seen.add(identity)
                  print("MATCH", json.dumps(attrs, sort_keys=True, default=str))
          PY

      - name: Resolve exact Kouga document download ids
        run: |
          python <<'PY'
          import html as html_lib
          import re
          import urllib.request
          from urllib.parse import urljoin

          page = "https://www.kouga.gov.za/document-library"
          req = urllib.request.Request(page, headers={"User-Agent": "Mozilla/5.0 EasyErfSourceProbe/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")

          targets = [
              "KOUGA LAND USE SCHEME.pdf",
              "202 - Kouga ILUS 2020-12 - Town Zoning Plan_6 St Francis Bay.pdf",
          ]
          for target in targets:
              idx = html.lower().find(target.lower())
              print("TARGET", target, "INDEX", idx)
              if idx < 0:
                  continue
              before = html[max(0, idx - 4000):idx + 1000]
              anchors = list(re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', before, flags=re.I|re.S))
              scored = []
              for match in anchors:
                  href = urljoin(page, match.group(1))
                  text = re.sub(r'<[^>]+>', ' ', match.group(2))
                  text = html_lib.unescape(re.sub(r'\s+', ' ', text)).strip()
                  distance = len(before) - match.end()
                  if "/download/" in href:
                      scored.append((distance, href, text[:180]))
              for distance, href, text in sorted(scored)[:5]:
                  print("CANDIDATE", distance, href, text)
          PY
