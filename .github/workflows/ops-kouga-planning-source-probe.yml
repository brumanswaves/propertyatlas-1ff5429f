name: Probe Kouga planning sources

on:
  push:
    branches:
      - ops/kouga-planning-source-probe
    paths:
      - .github/workflows/ops-kouga-planning-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe Kouga ArcGIS services
        run: |
          python <<'PY'
          import json
          import urllib.parse
          import urllib.request

          root = "https://services6.arcgis.com/HrQQGPZkIr5BuMyY/ArcGIS/rest/services"

          def get_json(url):
              with urllib.request.urlopen(url, timeout=20) as response:
                  return json.load(response)

          catalog = get_json(root + "?f=json")
          services = [s for s in catalog.get("services", []) if s.get("type") == "FeatureServer"]
          targets = []
          for service in services:
              name = service.get("name", "")
              if name == "St_Francis_Test" or name.startswith("service_") or name in {
                  "Land_Parcel_Property_Report_Developed",
                  "Map_WFL1",
                  "Kouga_SG_Properties",
              }:
                  targets.append(name)

          print("ARC_GIS_TARGET_COUNT", len(targets))
          for name in targets:
              url = f"{root}/{urllib.parse.quote(name, safe='')}/FeatureServer?f=json"
              try:
                  data = get_json(url)
              except Exception as exc:
                  print("SERVICE_FETCH_ERROR", name, type(exc).__name__)
                  continue
              print("SERVICE", name)
              print("  description", (data.get("serviceDescription") or data.get("description") or "")[:500].replace("\n", " "))
              print("  itemId", data.get("serviceItemId"))
              for layer in data.get("layers", []):
                  layer_name = layer.get("name", "")
                  layer_id = layer.get("id")
                  print("  LAYER", layer_id, layer_name)
                  try:
                      layer_data = get_json(f"{root}/{urllib.parse.quote(name, safe='')}/FeatureServer/{layer_id}?f=json")
                  except Exception as exc:
                      print("    LAYER_FETCH_ERROR", type(exc).__name__)
                      continue
                  field_names = [f.get("name", "") for f in layer_data.get("fields", [])]
                  aliases = [f.get("alias", "") for f in layer_data.get("fields", [])]
                  haystack = " ".join([layer_name, *field_names, *aliases]).lower()
                  keywords = [k for k in ["zoning", "zone", "land use", "landuse", "scheme", "ilus"] if k in haystack]
                  if keywords:
                      print("    PLANNING_KEYWORDS", ",".join(keywords))
                      print("    FIELDS", ",".join(field_names[:80]))
          PY

      - name: Probe Kouga document library download links
        run: |
          python <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin

          page = "https://www.kouga.gov.za/document-library"
          req = urllib.request.Request(page, headers={"User-Agent": "Mozilla/5.0 EasyErfSourceProbe/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")
          print("DOCUMENT_LIBRARY_BYTES", len(html))
          needles = [
              "KOUGA LAND USE SCHEME.pdf",
              "Town Zoning Plan_6 St Francis Bay.pdf",
          ]
          for needle in needles:
              idx = html.lower().find(needle.lower())
              print("DOCUMENT", needle, "FOUND" if idx >= 0 else "NOT_FOUND")
              if idx < 0:
                  continue
              snippet = html[max(0, idx-2500):idx+2500]
              hrefs = re.findall(r'href=["\']([^"\']+)["\']', snippet, flags=re.I)
              for href in hrefs:
                  absolute = urljoin(page, href)
                  if "document" in absolute.lower() or ".pdf" in absolute.lower() or "download" in absolute.lower():
                      print("  CANDIDATE_HREF", absolute)
          PY
