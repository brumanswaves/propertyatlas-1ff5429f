name: Verify Site Potential v2

on:
  push:
    branches:
      - site-potential-v2-upload-final
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: site-potential-v2-upload-final
  cancel-in-progress: false

jobs:
  test-build-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified product branch
        uses: actions/checkout@v4
        with:
          ref: site-potential-v2-upload-final
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npx --no-install vitest run 2>&1 | tee /tmp/site-potential-v2-tests.log

      - name: Run production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/site-potential-v2-build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-potential-v2-failure-diagnostics
          path: |
            /tmp/site-potential-v2-tests.log
            /tmp/site-potential-v2-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Remove temporary CI transport and preserve protected artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex-patch
          rm -f .github/workflows/codex-checkout-artifact.yml
          rm -f .github/workflows/apply-site-potential-v2.yml
          git restore --source=HEAD -- package.json package-lock.json bun.lock src/routeTree.gen.ts
          git diff --exit-code -- package.json package-lock.json bun.lock src/routeTree.gen.ts

      - name: Commit clean verified branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Clean verified Site Potential v2 branch"
          git push origin HEAD:site-potential-v2-upload-final
