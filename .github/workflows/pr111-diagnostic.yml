name: PR111 diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Full tests diagnostic
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee vitest.log
      - name: Browser OAuth diagnostic
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          npm run dev -- --host 127.0.0.1 --port 4173 > easyerf-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/auth >/dev/null; then break; fi
            sleep 1
          done
          EASY_ERF_BROWSER_URL=http://127.0.0.1:4173/auth node scripts/verify-founder-browser-oauth.mjs 2>&1 | tee browser.log
      - name: ESLint diagnostic
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npx eslint --no-warn-ignored --rule 'prettier/prettier: off' src/components/property/investigation/GuidedSitePotentialStep.tsx 2>&1 | tee eslint.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr111-diagnostics
          path: |
            vitest.log
            browser.log
            easyerf-vite.log
            eslint.log
      - name: Fail if diagnostics failed
        if: steps.tests.outcome == 'failure' || steps.browser.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: exit 1
