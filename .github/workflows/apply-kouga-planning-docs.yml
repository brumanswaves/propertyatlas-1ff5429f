name: Apply Kouga planning documentation patch

on:
  push:
    branches:
      - codex/kouga-res1-official-scheme-evidence
    paths:
      - .github/workflows/apply-kouga-planning-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kouga-res1-official-scheme-evidence
      - name: Refresh canonical project documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          current = Path('docs/EASY_ERF_CURRENT_STATE.md')
          text = current.read_text()
          text = text.replace(
              'Baseline entering Founder entitlement-history work: 2026-08-15, GitHub `main` at `9df0c1fa7ad6c5bf72684473272bffc040249e48` after merged PR #105.',
              'Baseline entering verified Kouga scheme-evidence work: 2026-08-20, GitHub `main` at `1069f315c1fd867cf5608bdf89b1575ea1d99623` after merged PR #106.'
          )
          text = text.replace(
              '- Verified Kouga planning-source metadata for the municipality-wide 2021 Land Use Scheme and St Francis Bay town zoning plan without claiming parcel-level zoning proof.',
              '- Verified Kouga planning-source metadata for the municipality-wide 2021 Land Use Scheme and St Francis Bay town zoning plan without claiming parcel-level zoning proof.\n- Current tranche retrieves and cites the official Kouga Land Use Scheme 2021 and promotes only its verified general RES1 scheme controls, with parcel-area applicability preserved and no automatic parcel zoning claim.'
          )
          text = text.replace(
              '- Kouga planning sources are stronger, but Easy Erf still does not have a verified parcel-specific zoning adapter for the published St Francis Bay zoning plan.',
              '- Kouga RES1 general scheme rules are now source-verified, but Easy Erf still does not have a verified parcel-specific zoning adapter/correlation for the published St Francis Bay zoning plan. The scheme rules must remain separate from proof that any specific erf is RES1.'
          )
          old_recommended = '''## Recommended Next Best Project Action\n\nFinish the entitlement intervention-history tranche through the full regression/build gate and merge only if green. After that, inspect the existing failed Site Potential retry path and only expose a Founder support retry if it can preserve ownership validation, retryability rules, generation-spend safety and a durable admin intervention audit. Keep refund/payment actions absent and keep PR #95 gated until founder Supabase Google OAuth is verified.\n'''
          new_recommended = '''## Recommended Next Best Project Action\n\nComplete and verify the official Kouga RES1 scheme-evidence tranche, then tackle the remaining property-specific planning gap: correlate the official St Francis Bay zoning-plan evidence to the canonical parcel without guessing. Erf 1570 should be the first acceptance case. Keep the result explicit if the map cannot be reliably correlated, and preserve manual/document zoning confirmation as the only working parcel conclusion until stronger evidence exists.\n\nKeep infrastructure work separate: PR #108 remains an open ownership guardrail, PR #107 remains the R999 Early Access commercial shell, and founder Supabase frontend cutover stays gated until Google OAuth is verified. No deployment, live migration or new backend is required for the planning-evidence tranche.\n'''
          if old_recommended not in text:
              raise SystemExit('Current State recommended-action marker not found')
          text = text.replace(old_recommended, new_recommended)
          current.write_text(text)

          decisions = Path('docs/EASY_ERF_DECISION_LOG.md')
          dtext = decisions.read_text().rstrip() + '\n\n'
          dtext += '''## EE-025 - Verified general scheme rules never prove parcel zoning\n\n- Date: 2026-08-20.\n- Decision: Easy Erf may promote a municipal planning rule from review-required candidate to active published general rule only after the official source has been retrieved/read and the rule has a durable source citation. That promotion never proves that a specific parcel is in the zone.\n- Rationale: A trustworthy planning engine needs to distinguish two separate questions: what the official scheme says for a zone, and which zone actually applies to the erf. Solving the first must not silently answer the second.\n- Implementation: The official Kouga Land Use Scheme 2021 is the verified source for RES1 primary/consent uses and Chapter 7 clause 24 development parameters. Size-banded controls are applied only when the canonical erf area fits the published band. The St Francis Bay zoning-plan source remains a separate unresolved parcel-correlation problem, and automatic zoning detection remains disabled.\n- Boundary handling: Where the published scheme expresses exclusive `< 400 m²` and `> 400 m²` rows, Easy Erf does not guess the applicable size-band controls for an exactly 400 m² erf or when area is unavailable.\n- Do not regress: Never label a general scheme rule as a property-specific right; never infer RES1 from Sea Vista, erf size, scheme presence or a manually selected zone; never enable automatic zoning detection until the parcel correlation source is verified end to end.\n- Related: EE-008, EE-010, EE-020, EE-022.\n'''
          decisions.write_text(dtext)

          backlog = Path('docs/EASY_ERF_IDEA_BACKLOG.md')
          btext = backlog.read_text()
          now_marker = '## NOW\n\n'
          now_item = '''### Correlate St Francis Bay zoning-plan evidence to the canonical parcel\n\n- Idea: Determine whether the official Kouga St Francis Bay zoning plan can be reliably correlated to an Easy Erf parcel, starting with Erf 1570, without inferring zoning from locality or scheme rules.\n- Expected value: Converts the remaining planning bottleneck from a manual working-zone conclusion toward property-specific municipal evidence.\n- Dependencies: Official zoning-plan artifact, canonical parcel geometry/identity, a reproducible correlation method and explicit confidence/provenance.\n- Why now: The general RES1 scheme rules are now source-verified. The unresolved high-value question is whether the official zoning map can prove which zone applies to the parcel.\n\n'''
          if now_marker not in btext:
              raise SystemExit('Backlog NOW marker not found')
          btext = btext.replace(now_marker, now_marker + now_item, 1)
          btext = btext.replace(
              '### Municipal planning and zoning integrations\n\n- Idea: Add property-specific municipal zoning, planning controls and official documents.\n- Expected value: Replace working assumptions with stronger evidence for build-envelope and strategy decisions.\n- Dependencies: Municipal data access, document provenance, jurisdiction mapping and legal review.\n- Why now: Published rules are currently context, not proof of a property-specific right.\n',
              '### Municipal planning and zoning integrations\n\n- Idea: Extend the verified planning-source pattern to property-specific municipal zoning, overlays, applications and official documents, then additional municipalities.\n- Expected value: Replace working assumptions with stronger evidence for build-envelope and strategy decisions.\n- Dependencies: Municipal data access, document provenance, jurisdiction mapping and legal review.\n- Why next: Kouga RES1 general scheme controls are now source-verified; parcel-specific zoning correlation and broader municipal coverage remain unresolved.\n'
          )
          backlog.write_text(btext)
          PY
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "TuismoreAI"
          git config user.email "brumanswaves@gmail.com"
          git add docs/EASY_ERF_CURRENT_STATE.md docs/EASY_ERF_DECISION_LOG.md docs/EASY_ERF_IDEA_BACKLOG.md
          git diff --cached --check
          git commit -m "Document verified Kouga scheme evidence direction"
          git push origin HEAD:codex/kouga-res1-official-scheme-evidence
