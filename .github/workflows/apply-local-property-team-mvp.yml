name: Build Local Property Team MVP

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-local-team:
    if: github.head_ref == 'local-property-team-mvp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local-property-team-mvp
          fetch-depth: 0

      - name: Integrate Local Property Team
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          site = Path('src/components/property/dossier/SitePotentialTab.tsx')
          text = site.read_text()
          pattern = re.compile(r'\n\s*<section\s+id="site-potential-credits".*?</section>\n(?=\s*<section className="rounded-\[1\.5rem\] border border-\[#0D1B2A\]/10 bg-white p-6">)', re.S)
          text, count = pattern.subn('\n      {/* Credit purchases are intentionally hidden for the no-payment MVP. */}\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Site Potential credit section, replaced {count}')
          site.write_text(text)

          panel = Path('src/components/property/OfficialParcelPanel.tsx')
          text = panel.read_text()
          import_line = 'import { SitePotentialTab } from "./dossier/SitePotentialTab";\n'
          if 'LocalPropertyTeam' not in text:
              text = text.replace(import_line, import_line + 'import { LocalPropertyTeam } from "./dossier/LocalPropertyTeam";\n', 1)
          old = '''          {tab === "local-services" && (
            <section className="rounded-[1.5rem] border border-[#D9E6F2] bg-white p-5 shadow-[0_18px_45px_-36px_rgba(13,27,42,0.42)]">
              <div className="text-[10px] font-bold uppercase tracking-[0.16em] text-[#FF6A00]">
                Local Services
              </div>
              <h3 className="mt-2 text-xl font-semibold tracking-tight text-[#0D1B2A]">
                Post-report follow-up
              </h3>
              <p className="mt-2 max-w-3xl text-sm leading-6 text-[#0D1B2A]/68">
                Use this space after the Easy Erf Report to plan practical follow-up with local
                professionals, council offices, conveyancers, architects, builders, valuers or
                engineers. Easy Erf does not verify, rank or recommend providers in this MVP.
              </p>
              <div className="mt-4 grid gap-3 md:grid-cols-3">
                {[
                  "Council and municipal checks",
                  "Architect, engineer or builder questions",
                  "Conveyancing, transfer or valuation follow-up",
                ].map((item) => (
                  <div
                    key={item}
                    className="rounded-2xl border border-[#D9E6F2] bg-[#F7FBFF] p-4 text-sm font-semibold text-[#0D1B2A]"
                  >
                    {item}
                  </div>
                ))}
              </div>
            </section>
          )}'''
          new = '''          {tab === "local-services" && (
            <LocalPropertyTeam
              parcel={normalizedParcel}
              siteMode={workspaceState.sitePotential.mode}
            />
          )}'''
          if old not in text:
              raise SystemExit('Local Services placeholder block not found')
          panel.write_text(text.replace(old, new, 1))

          dossier = Path('src/components/property/ErfResearchDossier.tsx')
          text = dossier.read_text()
          union_old = '  | "calculators"\n  | "stoep-report";'
          union_new = '  | "calculators"\n  | "stoep-report"\n  | "local-services";'
          if union_old not in text:
              raise SystemExit('DossierView union target not found')
          text = text.replace(union_old, union_new, 1)
          start = text.index('function StoepAiReportView')
          needle = '''        </article>
      </div>
    </section>
  );
}'''
          end = text.find(needle, start)
          if end < 0:
              raise SystemExit('Easy Erf Report closing block not found')
          replacement = '''        </article>
      </div>

      <section className="mt-5 rounded-[1.5rem] border border-[#FF6A00]/25 bg-[#FFF7ED] p-5">
        <div className="text-[10px] font-bold uppercase tracking-[0.16em] text-[#B24A00]">
          Take action on this erf
        </div>
        <div className="mt-2 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <h4 className="text-lg font-semibold text-[#0D1B2A]">Assemble a local property team</h4>
            <p className="mt-1 max-w-3xl text-sm leading-6 text-[#0D1B2A]/66">
              Find relevant local professionals and services based on this erf's location and property context.
            </p>
          </div>
          <button
            type="button"
            onClick={() => onSelectView?.("local-services")}
            className="inline-flex min-h-11 shrink-0 items-center justify-center gap-2 rounded-full bg-[#FF6A00] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#ff7d1f]"
          >
            Find Local Property Team <ArrowRight className="h-4 w-4" />
          </button>
        </div>
      </section>
    </section>
  );
}'''
          text = text[:end] + text[end:].replace(needle, replacement, 1)
          dossier.write_text(text)

          test = Path('src/components/property/__tests__/dossierUx.test.ts')
          test_text = test.read_text()
          marker = 'describe("Local Property Team MVP guardrails"'
          if marker not in test_text:
              test_text += '''\n\ndescribe("Local Property Team MVP guardrails", () => {
  it("connects the report to a real Local Property Team and hides purchases", () => {
    const panel = read("src/components/property/OfficialParcelPanel.tsx");
    const dossier = read("src/components/property/ErfResearchDossier.tsx");
    const localTeam = read("src/components/property/dossier/LocalPropertyTeam.tsx");
    const sitePotential = read("src/components/property/dossier/SitePotentialTab.tsx");
    const serverRoute = read("src/routes/api/local-services.search.ts");

    expect(panel.indexOf('label: "Easy Erf Report"')).toBeLessThan(
      panel.indexOf('label: "Local Services"'),
    );
    expect(panel).toContain("<LocalPropertyTeam");
    expect(dossier).toContain("Find Local Property Team");
    expect(dossier).toContain('onSelectView?.("local-services")');
    expect(localTeam).toContain("Plan and Build");
    expect(localTeam).toContain("Protect and Maintain");
    expect(localTeam).toContain("Connect the Property");
    expect(localTeam).toContain("Buy, Sell or Manage");
    expect(localTeam).toContain("Google place result");
    expect(localTeam).toContain("Search wider area");
    expect(localTeam).toContain("Results are sourced from Google");
    expect(serverRoute).toContain("process.env.GOOGLE_PLACES_API_KEY");
    expect(serverRoute).not.toContain("VITE_GOOGLE_PLACES_API_KEY");
    expect(serverRoute).toContain("pageSize: 3");
    expect(serverRoute).toContain('place.businessStatus !== "CLOSED_PERMANENTLY"');
    expect(sitePotential).not.toContain('id="site-potential-credits"');
    expect(sitePotential).not.toContain("Checkout connection pending");
  });
});
'''
          test.write_text(test_text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Run production build
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/apply-local-property-team-mvp.yml
          git checkout -- package.json package-lock.json bun.lock 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/apply-local-property-team-mvp.yml
          git commit -m "Build Local Property Team provider workflow"
          git push origin HEAD:local-property-team-mvp
