name: Temporary guided task first UX repair

on:
  push:
    branches:
      - chatgpt/guided-task-first-mobile-header
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-guided-task-first-ux-repair
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repair branch with built-in Git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin chatgpt/guided-task-first-mobile-header
          git checkout -B chatgpt/guided-task-first-mobile-header FETCH_HEAD
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git config user.name "Easy Erf verification automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply canonical product patch and update stale guardrails
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/temporary-apply-guided-task-first-ux.mjs")
          text = script.read_text()
          placeholder = "${tab}"
          if text.count(placeholder) != 2:
              raise SystemExit(f"Expected two tab placeholders, found {text.count(placeholder)}")
          script.write_text(text.replace(placeholder, r"\${tab}"))
          PY

          node scripts/temporary-apply-guided-task-first-ux.mjs

          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/property/__tests__/dossierUx.test.ts")
          text = path.read_text()
          replacements = {
              "max-md:pt-[calc(env(safe-area-inset-top)+0.75rem)]":
                  "max-md:pt-[calc(env(safe-area-inset-top)+0.5rem)]",
              '<div className="flex max-w-full shrink-0 flex-wrap items-center justify-end gap-2">':
                  '<div className="flex shrink-0 items-center justify-end gap-1.5 md:max-w-full md:flex-wrap md:gap-2">',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one stale guardrail occurrence for {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove temporary diagnostic machinery
        run: |
          rm -f \
            .github/workflows/temporary-guided-task-first-diagnostics.yml \
            .github/workflows/temporary-guided-task-first-patch.yml \
            scripts/temporary-apply-guided-task-first-ux.mjs \
            tmp/dossierUx-copy.txt
          rmdir tmp 2>/dev/null || true
          test ! -e .github/workflows/temporary-guided-task-first-diagnostics.yml
          test ! -e .github/workflows/temporary-guided-task-first-patch.yml
          test ! -e scripts/temporary-apply-guided-task-first-ux.mjs
          test ! -e tmp/dossierUx-copy.txt

      - name: Verify canonical UX markers
        run: |
          PANEL=src/components/property/OfficialParcelPanel.tsx
          grep -Fq 'data-mobile-workbench-header="compact"' "$PANEL"
          grep -Fq 'data-done-for-you-placement="after-primary-work"' "$PANEL"
          grep -Fq 'max-md:pt-[calc(env(safe-area-inset-top)+0.5rem)]' "$PANEL"
          grep -Fq 'min-h-0 flex-1 overflow-y-auto' "$PANEL"
          if grep -Fq 'h-[calc(100dvh-5.25rem)]' "$PANEL"; then
            echo "Legacy hardcoded workbench content height remains"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run focused UX tests
        run: >-
          npx vitest run
          src/components/humanReview/__tests__/humanReviewTakeoverCardTruth.test.ts
          src/components/property/__tests__/guidedTaskFirstUx.test.ts
          src/components/property/__tests__/simplificationPassB.test.ts
          src/components/property/__tests__/dossierUx.test.ts

      - name: Run full test suite
        run: npx vitest run

      - name: Build production bundle
        run: npm run build

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Lint changed TypeScript files
        run: |
          mapfile -t CHANGED_TS_FILES < <(git diff --name-only --diff-filter=ACMR origin/main -- '*.ts' '*.tsx')
          if [ "${#CHANGED_TS_FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi
          printf 'Linting changed TypeScript files:\n%s\n' "${CHANGED_TS_FILES[*]}"
          npx eslint --no-warn-ignored --rule 'prettier/prettier: off' "${CHANGED_TS_FILES[@]}"

      - name: Check patch whitespace
        run: git diff --check origin/main

      - name: Commit and push verified canonical patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git status --short
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No canonical changes were produced"
            exit 1
          fi
          git commit -m "Fix guided task priority and compact mobile workbench"
          git push origin HEAD:chatgpt/guided-task-first-mobile-header
