name: Temporary PR 162 final formatter

on:
  push:
    branches:
      - chatgpt/ee-r999-customer-notification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ee-r999-customer-notification
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format and lint the verified failing file
        run: |
          npx prettier --write src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts
          npx eslint src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts

      - name: Commit only the formatted test and remove this workflow
        run: |
          git config user.name "TuismoreAI"
          git config user.email "brumanswaves@gmail.com"
          git rm .github/workflows/tmp-pr162-final-format.yml
          git add src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts
          printf '%s\n' \
            .github/workflows/tmp-pr162-final-format.yml \
            src/lib/payments/__tests__/easyErfCustomerNotificationGuardrails.test.ts \
            | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting change was produced."
            exit 1
          fi
          git commit -m "style: format notification guardrail test"
          git push origin HEAD:chatgpt/ee-r999-customer-notification
