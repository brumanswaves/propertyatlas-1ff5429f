name: Verify Kouga planning source metadata

on:
  push:
    branches:
      - codex/kouga-planning-source-artifacts-v1
    paths:
      - .github/workflows/ops-kouga-planning-source-artifacts.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kouga-planning-source-artifacts-v1
          fetch-depth: 0

      - name: Apply source metadata patch
        run: python .github/scripts/patch-kouga-planning-sources.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format changed files
        run: npx prettier --write src/lib/planning/kougaPlanningRegistry.ts src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts

      - name: Run focused planning tests
        run: npx vitest run src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts src/lib/planning/__tests__/municipalityPlanningRegistry.test.ts src/lib/planning/__tests__/parcelPlanningAssessment.test.ts src/lib/investigation/__tests__/planningInvestigationJob.test.ts

      - name: Run full test suite
        run: npx vitest run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run targeted ESLint
        run: npx eslint src/lib/planning/kougaPlanningRegistry.ts src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts --rule 'prettier/prettier: off'

      - name: Build production bundle
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified source metadata
        run: |
          git config user.name "Easy Erf Build Driver"
          git config user.email "brumanswaves@gmail.com"
          git add src/lib/planning/kougaPlanningRegistry.ts src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts
          git commit -m "Add official Kouga planning source artifacts"
          git push origin HEAD:codex/kouga-planning-source-artifacts-v1
