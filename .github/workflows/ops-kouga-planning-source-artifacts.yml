name: Verify Kouga official planning source metadata

on:
  push:
    branches:
      - codex/kouga-planning-source-artifacts-v1
    paths:
      - .github/workflows/ops-kouga-planning-source-artifacts.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kouga-planning-source-artifacts-v1
          fetch-depth: 0

      - name: Add verified official Kouga planning source metadata
        run: |
          python <<'PY'
          from pathlib import Path

          registry_path = Path('src/lib/planning/kougaPlanningRegistry.ts')
          registry = registry_path.read_text()

          note_start = registry.index(' * SOURCE VERIFICATION NOTE (important, do not remove):')
          note_end = registry.index(' */', note_start) + len(' */')
          new_note = ''' * SOURCE VERIFICATION NOTE (important, do not remove):
           * The official Kouga website currently lists the 2021 Land Use Scheme and the
           * St Francis Bay town zoning-plan PDF. Their presence was re-verified on
           * 2026-08-15. Easy Erf has not yet retrieved and parsed the scheme PDF or town
           * zoning-plan PDF inside the product, so the Residential Zone 1 numeric controls
           * below remain `manual_candidate` review-required values. They must never be
           * rendered as active official parcel rules until the relevant text or map has
           * been read, cited and correlated to the correct property.
           */'''.replace('           *', ' *')
          registry = registry[:note_start] + new_note + registry[note_end:]

          source_start_marker = '  {\n    id: "kouga-land-use-scheme-2021",'
          source_end_marker = '  {\n    id: "kouga-building-aesthetics-2025",'
          source_start = registry.index(source_start_marker)
          source_end = registry.index(source_end_marker, source_start)
          new_sources = '''  {
            id: "kouga-land-use-scheme-2021",
            municipality: KOUGA,
            title: "Kouga Land Use Scheme 2021",
            sourceType: "land_use_scheme",
            url: "https://www.kouga.gov.za/document-library",
            jurisdiction: "municipal",
            status: "active",
            version: "2021",
            effectiveDate: null,
            publishedDate: "2021-01-01",
            lastVerifiedAt: "2026-08-15",
            planningAreas: [],
            notes:
              "Municipality-wide Land Use Scheme listed in the official Kouga document library. Source presence is verified, but Easy Erf must still retrieve and cite the scheme text before promoting numeric zone controls from manual_candidate status.",
          },
          {
            id: "kouga-st-francis-bay-town-zoning-plan-2020-12",
            municipality: KOUGA,
            title: "Kouga ILUS Town Zoning Plan 6 - St Francis Bay",
            sourceType: "zoning_map",
            url: "https://www.kouga.gov.za/document-library",
            jurisdiction: "municipal",
            status: "active",
            version: "2020-12",
            effectiveDate: null,
            publishedDate: null,
            lastVerifiedAt: "2026-08-15",
            planningAreas: ["Sea Vista"],
            notes:
              "Official document library lists PDF '202 - Kouga ILUS 2020-12 - Town Zoning Plan_6 St Francis Bay.pdf'. Presence verified 2026-08-15. Easy Erf has not yet fetched or parsed the PDF in-product, so this source must not be used alone to assert a parcel zoning.",
          },
'''
          registry = registry[:source_start] + new_sources + registry[source_end:]
          registry_path.write_text(registry)

          test_path = Path('src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts')
          test_path.write_text('''import { describe, expect, it } from "vitest";\nimport { KOUGA_PLANNING_REGISTRY } from "../kougaPlanningRegistry";\nimport {\n  canAttemptOfficialZoningDetection,\n  findPlanningSource,\n  findZone,\n  planningSourcesFor,\n} from "../municipalityPlanningRegistry";\n\ndescribe("Kouga official planning source metadata", () => {\n  it("makes the municipality-wide 2021 scheme available to Sea Vista investigations", () => {\n    const sourceIds = planningSourcesFor(KOUGA_PLANNING_REGISTRY, "Sea Vista").map(\n      (source) => source.id,\n    );\n\n    expect(sourceIds).toContain("kouga-land-use-scheme-2021");\n    expect(sourceIds).toContain("kouga-st-francis-bay-town-zoning-plan-2020-12");\n  });\n\n  it("records the official St Francis Bay zoning-plan artifact without claiming parcel zoning", () => {\n    const source = findPlanningSource(\n      KOUGA_PLANNING_REGISTRY,\n      "kouga-st-francis-bay-town-zoning-plan-2020-12",\n    );\n\n    expect(source?.status).toBe("active");\n    expect(source?.jurisdiction).toBe("municipal");\n    expect(source?.sourceType).toBe("zoning_map");\n    expect(source?.lastVerifiedAt).toBe("2026-08-15");\n    expect(source?.planningAreas).toEqual(["Sea Vista"]);\n    expect(source?.notes).toMatch(/must not be used alone to assert a parcel zoning/i);\n    expect(canAttemptOfficialZoningDetection(KOUGA_PLANNING_REGISTRY)).toBe(false);\n  });\n\n  it("keeps the unparsed RES1 numbers review-required", () => {\n    const zone = findZone(KOUGA_PLANNING_REGISTRY, "RES1");\n\n    expect(zone?.status).toBe("manual_candidate");\n    expect(zone?.rules.length).toBeGreaterThan(0);\n    expect(zone?.rules.every((rule) => rule.status === "manual_candidate")).toBe(true);\n    expect(zone?.rules.every((rule) => rule.citation == null)).toBe(true);\n  });\n});\n''')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format changed files
        run: >-
          npx prettier --write
          src/lib/planning/kougaPlanningRegistry.ts
          src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts

      - name: Run focused planning tests
        run: >-
          npx vitest run
          src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts
          src/lib/planning/__tests__/municipalityPlanningRegistry.test.ts
          src/lib/planning/__tests__/parcelPlanningAssessment.test.ts
          src/lib/investigation/__tests__/planningInvestigationJob.test.ts

      - name: Run full test suite
        run: npx vitest run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run targeted ESLint
        run: >-
          npx eslint
          src/lib/planning/kougaPlanningRegistry.ts
          src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts
          --rule 'prettier/prettier: off'

      - name: Build production bundle
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified source metadata
        run: |
          git config user.name "Easy Erf Build Driver"
          git config user.email "brumanswaves@gmail.com"
          git add \
            src/lib/planning/kougaPlanningRegistry.ts \
            src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts
          git commit -m "Add official Kouga planning source artifacts"
          git push origin HEAD:codex/kouga-planning-source-artifacts-v1
