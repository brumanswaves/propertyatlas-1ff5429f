name: Easy Erf ownership doc sync

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.head_ref == 'codex/canonical-backend-ownership-guardrail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-backend-ownership-guardrail
          fetch-depth: 0
      - name: Record canonical ownership decision and backlog priority
        shell: python
        run: |
          from pathlib import Path

          decision = Path("docs/EASY_ERF_DECISION_LOG.md")
          text = decision.read_text()
          entry = '''## EE-024 - Canonical backend ownership is separate from browser cutover

- Date: 2026-08-17.
- Decision: The founder-owned Easy Erf Supabase project is the canonical backend target for repository/CLI and future production work. The older Lovable-managed project is rollback/runtime infrastructure only during the controlled cutover window.
- Rationale: Repository ownership must not drift merely because the current browser environment still points at the rollback backend. Leaving canonical CLI configuration on the rollback project creates an avoidable risk that future migration or function work targets the wrong database.
- Implementation: `supabase/config.toml` points at the founder-owned Easy Erf project and `docs/EASY_ERF_BACKEND_OWNERSHIP.md` defines the boundary. Browser Supabase/auth environment values remain unchanged until Google OAuth and the signed-in Erf 1570 acceptance gates pass.
- Safety: This ownership correction does not deploy, publish, migrate data, change the live browser backend or authorize any consequential production action.
- Do not regress: Do not create a parallel Easy Erf backend, do not treat Lovable-generated environment configuration as ownership truth, and do not bundle safe repository ownership fixes with an unsafe premature frontend cutover.
- Related: EE-005, EE-021, PR #95.
'''
          if "## EE-024 - Canonical backend ownership is separate from browser cutover" not in text:
              decision.write_text(text.rstrip() + "\n\n" + entry)

          backlog = Path("docs/EASY_ERF_IDEA_BACKLOG.md")
          backlog_text = backlog.read_text()
          priority = '''### Complete canonical founder-backend cutover and signed-in acceptance

- Idea: Keep repository/CLI ownership on the founder-owned Easy Erf backend, enable and verify Google OAuth there, then run the full signed-in Erf 1570 journey before publishing the frontend cutover.
- Expected value: Removes the largest gap between repository confidence and a genuinely usable production investigation while preventing new work from drifting back onto rollback infrastructure.
- Dependencies: Existing founder Supabase project, Google OAuth configuration, rollback-safe auth bridge, current Site Potential API/client transport and a signed-in acceptance account.
- Why now: Guided, Dossier and Report already share canonical planning, evidence, Strategy and Site Potential state. The remaining highest-risk gap is proving those paths together on the canonical backend.

'''
          marker = "## NOW\n\n"
          if "### Complete canonical founder-backend cutover and signed-in acceptance" not in backlog_text:
              if marker not in backlog_text:
                  raise SystemExit("NOW marker not found in backlog")
              backlog.write_text(backlog_text.replace(marker, marker + priority, 1))

          Path(".github/workflows/easy-erf-ownership-doc-sync.yml").unlink()
      - name: Commit synced canonical docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EASY_ERF_DECISION_LOG.md docs/EASY_ERF_IDEA_BACKLOG.md .github/workflows/easy-erf-ownership-doc-sync.yml
          git diff --cached --check
          git commit -m "Record canonical Easy Erf backend ownership"
          git push origin HEAD:codex/canonical-backend-ownership-guardrail
