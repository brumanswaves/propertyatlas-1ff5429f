name: Remove competing home hint

on:
  push:
    branches:
      - chatgpt/fix-human-review-ux
    paths:
      - .github/workflows/remove-competing-home-hint.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Remove legacy home hint that blocks choice overlay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: chatgpt/fix-human-review-ux
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=50 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
          python scripts/remove-competing-home-hint.py
          git diff --check
          git config user.name "Easy Erf CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Remove competing map helper from home choices"
          git push origin "HEAD:${HEAD_REF}"
