name: Update report-order cleanup migration inventory

on:
  push:
    branches:
      - chatgpt/fix-report-orders-legacy-policies
    paths:
      - .github/workflows/update-policy-cleanup-migration-inventory.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch with built-in Git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Register cleanup migration and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts")
          source = path.read_text(encoding="utf-8")
          old = (
              "    expect(migrationNames).toHaveLength(29);\n"
              "    expect(migrationNames).toEqual([\n"
              "      ...historicalMigrationNames,\n"
              "      \"20260813090000_make_site_potential_worker_portable.sql\",\n"
              "      \"20260829113000_secure_easy_erf_stripe_fulfillment.sql\",\n"
              "    ]);"
          )
          new = (
              "    expect(migrationNames).toHaveLength(30);\n"
              "    expect(migrationNames).toEqual([\n"
              "      ...historicalMigrationNames,\n"
              "      \"20260813090000_make_site_potential_worker_portable.sql\",\n"
              "      \"20260829113000_secure_easy_erf_stripe_fulfillment.sql\",\n"
              "      \"20260829140000_remove_legacy_report_order_policies.sql\",\n"
              "    ]);"
          )
          if source.count(old) != 1:
              raise SystemExit("Expected one exact migration inventory assertion")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/update-policy-cleanup-migration-inventory.yml").unlink()
          PY

      - name: Commit inventory update and remove helper
        run: |
          git config user.name "Easy Erf CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- src/lib/sitePotential/__tests__/sitePotentialRepair.test.ts .github/workflows/update-policy-cleanup-migration-inventory.yml
          git diff --cached --check
          git commit -m "Register report-order policy cleanup migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
