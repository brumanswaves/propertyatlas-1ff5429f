name: Lock Human Review commercial copy

on:
  push:
    branches:
      - chatgpt/human-review-product-v2
    paths:
      - .github/workflows/lock-human-review-commercial-copy.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Keep once-off no-subscription truth explicit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: chatgpt/human-review-product-v2
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=100 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          p = Path("src/routes/pricing.tsx")
          s = p.read_text()
          old = '<span className="pb-1 text-xs text-[#64748B]">one property</span>'
          new = '<span className="pb-1 text-xs text-[#64748B]">once-off · one property · no subscription</span>'
          if s.count(old) != 1:
              raise SystemExit(f"pricing commercial copy anchor mismatch: {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "Easy Erf CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/pricing.tsx
          git commit -m "Keep Human Review once-off commercial truth explicit"
          git push origin "HEAD:${HEAD_REF}"
