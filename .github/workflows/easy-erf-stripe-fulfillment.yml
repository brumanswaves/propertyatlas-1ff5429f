name: Easy Erf Stripe fulfillment verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/easy-erf-stripe-fulfillment.yml
      - scripts/verify-easy-erf-stripe-migration.sql
      - src/lib/payments/**
      - src/routes/admin.tsx
      - supabase/config.toml
      - supabase/functions/_shared/easyErfStripePaymentContract.ts
      - supabase/functions/easy-erf-stripe-webhook/**
      - supabase/migrations/20260829113000_secure_easy_erf_stripe_fulfillment.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easy-erf-stripe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  edge-function:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository with built-in Git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch --no-tags --depth=1 origin "${REF}"
          git checkout --detach FETCH_HEAD

      - name: Install verified Deno 2.9.6 binary
        run: |
          curl --fail --location --silent --show-error \
            --output deno.zip \
            https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-unknown-linux-gnu.zip
          echo "394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2  deno.zip" | sha256sum --check
          unzip -q deno.zip
          ./deno --version

      - name: Type-check signed Stripe webhook
        run: >-
          ./deno check
          --node-modules-dir=auto
          --no-lock
          supabase/functions/easy-erf-stripe-webhook/index.ts

      - name: Run focused payment contract tests
        run: |
          npm install --no-audit --no-fund
          npx vitest run \
            src/lib/payments/__tests__/easyErfStripePaymentContract.test.ts \
            src/lib/payments/__tests__/easyErfStripeFulfillmentGuardrails.test.ts

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository with built-in Git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch --no-tags --depth=1 origin "${REF}"
          git checkout --detach FETCH_HEAD

      - name: Apply and prove migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: >-
          psql
          --host 127.0.0.1
          --port 54329
          --username postgres
          --dbname postgres
          --file scripts/verify-easy-erf-stripe-migration.sql
