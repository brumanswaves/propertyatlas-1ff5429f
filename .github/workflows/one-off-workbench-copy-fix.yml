name: One-off workbench Site Potential copy repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" FETCH_HEAD

      - name: Apply exact product-copy replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/property/OfficialParcelPanel.tsx")
          text = path.read_text()
          replacements = {
              "Concepts are visual starting points, not architectural plans or municipal approvals. This section is optional and can be skipped without blocking the Easy Erf Report.":
                  "The parcel/map build envelope and street-side build lines are indicative decision support, not architectural plans or municipal approvals. This section is optional and can be skipped without blocking the Easy Erf Report.",
              "After the numbers, choose whether to generate a visual concept pack or explicitly skip this optional step.":
                  "After the numbers, review and accept the deterministic build envelope, or explicitly skip this optional step.",
              "Select a preferred concept or skip Site Potential, then assemble the final report.":
                  "Accept the deterministic build envelope or skip Site Potential, then assemble the final report.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}; found {count}")
              text = text.replace(old, new)

          forbidden = [
              "Concepts are visual starting points",
              "generate a visual concept pack",
              "Select a preferred concept",
          ]
          for phrase in forbidden:
              if phrase in text:
                  raise SystemExit(f"Retired Site Potential phrase remains: {phrase}")

          path.write_text(text)
          PY

      - name: Remove this one-off workflow
        run: rm .github/workflows/one-off-workbench-copy-fix.yml

      - name: Commit exact repair to PR branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/property/OfficialParcelPanel.tsx .github/workflows/one-off-workbench-copy-fix.yml
          git diff --cached --check
          git commit -m "Remove retired Site Potential concept copy"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
