name: PR 157 diagnostic isolation

on:
  push:
    branches:
      - chatgpt/report-investigation-coherence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr157-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolate:
    name: Isolate ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: report-ordering
            test: places the report lens before Ask Easy Erf and Ask before the decision evidence
          - name: guided-ask-placement
            test: keeps the Guided Investigation free of the large Ask Easy Erf report panel
          - name: accepted-envelope-reuse
            test: uses the accepted deterministic envelope for Guided and report consumers
          - name: report-map-fallback
            test: renders a real parcel map in the web report and a deterministic print fallback
          - name: site-potential-scope
            test: keeps Site Potential limited to map and street-side build lines

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run one guardrail test
        run: npx vitest run src/lib/reports/__tests__/reportInvestigationCoherenceGuardrails.test.ts -t "${{ matrix.test }}"
