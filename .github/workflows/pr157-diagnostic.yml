name: PR 157 diagnostic isolation

on:
  push:
    branches:
      - chatgpt/report-investigation-coherence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr157-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Find Guided Ask references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matches: ${{ steps.find.outputs.matches }}

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Find files containing the report-only component
        id: find
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          files = sorted(Path("src/components/property/investigation").glob("*.tsx"))
          matches = [str(path) for path in files if "AskEasyErfPanel" in path.read_text()]
          print("matches=" + json.dumps(matches))
          PY

  expose:
    name: Match ${{ matrix.file }}
    needs: discover
    if: ${{ needs.discover.outputs.matches != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.discover.outputs.matches) }}

    steps:
      - name: Expose matching path in the job name
        run: echo "${{ matrix.file }} contains AskEasyErfPanel"

  no-match:
    name: No Guided AskEasyErfPanel references
    needs: discover
    if: ${{ needs.discover.outputs.matches == '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm no match
        run: true
