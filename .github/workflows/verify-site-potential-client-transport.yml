name: Verify Site Potential client transport

on:
  push:
    branches:
      - codex/founder-site-potential-client-transport
    paths:
      - .github/workflows/verify-site-potential-client-transport.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/founder-site-potential-client-transport
          fetch-depth: 0

      - name: Update stale transport guardrails
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          beta_path = Path("src/lib/sitePotential/__tests__/betaEntitlements.test.ts")
          beta = beta_path.read_text()
          beta = beta.replace(
              '    const progress = read("src/lib/sitePotential/generationProgress.ts");\n',
              '    const progress = read("src/lib/sitePotential/generationProgress.ts");\n'
              '    const apiClient = read("src/lib/sitePotential/sitePotentialApiClient.ts");\n',
              1,
          )
          old_beta = (
              '    expect(tab).toContain("/api/site-potential/beta-redeem");\n'
              '    expect(tab).toContain("/api/site-potential/pack-status");\n'
              '    expect(tab).toContain("/api/site-potential/retry-pack");\n'
          )
          new_beta = (
              '    expect(tab).toContain("fetchSitePotentialApi");\n'
              '    expect(apiClient).toContain(\'"beta-redeem"\');\n'
              '    expect(apiClient).toContain(\'"pack-status"\');\n'
              '    expect(apiClient).toContain(\'"retry-pack"\');\n'
              '    expect(apiClient).toContain("VITE_SITE_POTENTIAL_EDGE_API");\n'
              '    expect(apiClient).toContain(\'`/api/site-potential/${input.route}`\');\n'
          )
          if old_beta not in beta:
              raise SystemExit("beta entitlement guardrail target not found")
          beta_path.write_text(beta.replace(old_beta, new_beta, 1))

          dossier_path = Path("src/components/property/__tests__/dossierUx.test.ts")
          dossier = dossier_path.read_text()
          dossier = dossier.replace(
              '    const sitePotential = read("src/components/property/dossier/SitePotentialTab.tsx");\n'
              '    const serverRoute = read("src/routes/api/local-services.search.ts");\n',
              '    const sitePotential = read("src/components/property/dossier/SitePotentialTab.tsx");\n'
              '    const sitePotentialApi = read("src/lib/sitePotential/sitePotentialApiClient.ts");\n'
              '    const serverRoute = read("src/routes/api/local-services.search.ts");\n',
              1,
          )
          old_dossier = '    expect(sitePotential).toContain("/api/site-potential/retry-pack");\n'
          new_dossier = (
              '    expect(sitePotential).toContain("fetchSitePotentialApi");\n'
              '    expect(sitePotentialApi).toContain(\'"retry-pack"\');\n'
              '    expect(sitePotentialApi).toContain(\'`/api/site-potential/${input.route}`\');\n'
          )
          if old_dossier not in dossier:
              raise SystemExit("dossier retry guardrail target not found")
          dossier_path.write_text(dossier.replace(old_dossier, new_dossier, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Site Potential transport tests
        run: >-
          npx vitest run
          src/lib/sitePotential/__tests__/sitePotentialApiClient.test.ts
          src/lib/sitePotential/__tests__/sitePotentialEdgeApi.test.ts
          src/lib/sitePotential/__tests__/betaEntitlements.test.ts
          src/components/property/__tests__/dossierUx.test.ts

      - name: Run full test suite
        run: npx vitest run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Check stacked patch whitespace
        run: git diff --check ae14150d1bb099fe4779c15ddc72a68c5d11da17 HEAD

      - name: Commit verified guardrail fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/sitePotential/__tests__/betaEntitlements.test.ts src/components/property/__tests__/dossierUx.test.ts
          git diff --cached --check
          git commit -m "Update Site Potential transport guardrails"
          git push origin HEAD:codex/founder-site-potential-client-transport
