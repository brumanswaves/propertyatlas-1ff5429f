name: Diagnose Human Review full suite

on:
  push:
    branches:
      - chatgpt/human-review-product-v2
    paths:
      - .github/workflows/diagnose-human-review-full-suite.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: chatgpt/human-review-product-v2
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=100 origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture failed Vitest assertions
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=/tmp/vitest.json
          STATUS=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/vitest.json','utf8'));
          const out = [];
          out.push(`success=${data.success}`);
          out.push(`numFailedTestSuites=${data.numFailedTestSuites}`);
          out.push(`numFailedTests=${data.numFailedTests}`);
          for (const file of data.testResults || []) {
            const failed = (file.assertionResults || []).filter(x => x.status === 'failed');
            if (!failed.length && file.status !== 'failed') continue;
            out.push(`FILE ${file.name}`);
            for (const test of failed) {
              out.push(`TEST ${[...(test.ancestorTitles || []), test.title].join(' > ')}`);
              for (const msg of test.failureMessages || []) out.push(msg.slice(0, 5000));
            }
            if (file.message) out.push(file.message.slice(0, 5000));
          }
          fs.writeFileSync('tmp-human-review-vitest-failures.txt', out.join('\n\n') + '\n');
          NODE
          git config user.name "Easy Erf CI Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add tmp-human-review-vitest-failures.txt
          git commit -m "Record Human Review full-suite diagnostic"
          git push origin "HEAD:${HEAD_REF}"
          exit 0
