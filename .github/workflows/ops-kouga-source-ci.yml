name: Verify Kouga source overlay

on:
  push:
    branches:
      - codex/kouga-planning-source-artifacts-v1
    paths:
      - .github/workflows/ops-kouga-source-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kouga-planning-source-artifacts-v1
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run focused planning tests
        run: >-
          npx vitest run
          src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts
          src/lib/planning/__tests__/municipalityPlanningRegistry.test.ts
          src/lib/planning/__tests__/parcelPlanningAssessment.test.ts
          src/lib/investigation/__tests__/planningInvestigationJob.test.ts

      - name: Run full test suite
        run: npx vitest run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run targeted ESLint
        run: >-
          npx eslint
          src/lib/planning/kougaVerifiedPlanningSources.ts
          src/lib/planning/municipalityPlanningRegistry.ts
          src/lib/planning/__tests__/kougaOfficialPlanningSources.test.ts
          --rule 'prettier/prettier: off'

      - name: Build production bundle
        run: npm run build

      - name: Check stacked patch whitespace
        run: git diff --check e7aec1a2a13f62c57739f2ef8b08f72e4a83139e HEAD
