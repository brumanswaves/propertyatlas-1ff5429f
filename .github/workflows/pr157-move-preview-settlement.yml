name: PR 157 move SG preview settlement helper

on:
  push:
    branches:
      - chatgpt/report-investigation-coherence

permissions:
  contents: write

concurrency:
  group: pr157-move-preview-settlement
  cancel-in-progress: false

jobs:
  patch:
    name: Move helper out of React component module
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact source replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path("src/components/property/dossier/ReportContextSections.tsx")
          component_text = component.read_text()
          old_component_import = 'import { repairSgPreview } from "@/lib/workbench/sgPreviewRepair";\n'
          new_component_import = (
              old_component_import
              + 'import { registerSgPreviewSettlement } from "@/lib/reports/sgPreviewSettlement";\n'
          )
          if component_text.count(old_component_import) != 1:
              raise SystemExit("Expected one SG preview repair import")
          component_text = component_text.replace(old_component_import, new_component_import)

          old_helper = '''export function registerSgPreviewSettlement(
            onPreviewSettlement: ((settlement: Promise<void>) => void) | undefined,
            settlement: Promise<void>,
          ) {
            onPreviewSettlement?.(settlement);
          }

          '''
          if component_text.count(old_helper) != 1:
              raise SystemExit("Expected one component-local settlement helper")
          component.write_text(component_text.replace(old_helper, ""))

          test = Path("src/lib/reports/__tests__/contextSections.test.tsx")
          test_text = test.read_text()
          old_test_import = 'import { buildSgSectionModel } from "@/lib/reports/sgSection";\n'
          new_test_import = (
              old_test_import
              + 'import { registerSgPreviewSettlement } from "@/lib/reports/sgPreviewSettlement";\n'
          )
          if test_text.count(old_test_import) != 1:
              raise SystemExit("Expected one SG section test import")
          test_text = test_text.replace(old_test_import, new_test_import)
          old_named_import = '  registerSgPreviewSettlement,\n'
          if test_text.count(old_named_import) != 1:
              raise SystemExit("Expected one component helper test import")
          test.write_text(test_text.replace(old_named_import, ""))

          helper = Path("src/lib/reports/sgPreviewSettlement.ts")
          if helper.exists():
              raise SystemExit("Settlement helper file already exists")
          helper.write_text('''/**
           * Registers an SG preview settlement promise with the report print lifecycle.
           * Kept outside the React component module so Fast Refresh sees component-only exports.
           */
          export function registerSgPreviewSettlement(
            onPreviewSettlement: ((settlement: Promise<void>) => void) | undefined,
            settlement: Promise<void>,
          ) {
            onPreviewSettlement?.(settlement);
          }
          ''')
          PY

      - name: Verify the narrow refactor
        shell: bash
        run: |
          git diff --check
          npm install --no-audit --no-fund
          npx vitest run src/lib/reports/__tests__/contextSections.test.tsx
          npx eslint --no-warn-ignored --rule 'prettier/prettier: off' \
            src/components/property/dossier/ReportContextSections.tsx \
            src/lib/reports/sgPreviewSettlement.ts \
            src/lib/reports/__tests__/contextSections.test.tsx

      - name: Commit and push the verified refactor
        shell: bash
        run: |
          git config user.name "Easy Erf verification automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/components/property/dossier/ReportContextSections.tsx \
            src/lib/reports/sgPreviewSettlement.ts \
            src/lib/reports/__tests__/contextSections.test.tsx
          git diff --cached --check
          git commit -m "Move SG preview settlement helper out of component module"
          git push origin HEAD:chatgpt/report-investigation-coherence
