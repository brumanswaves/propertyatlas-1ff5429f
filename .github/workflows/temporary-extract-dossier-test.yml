name: Temporary extract failing dossier guardrail

on:
  push:
    branches:
      - chatgpt/guided-task-first-mobile-header
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-extract-dossier-guardrail
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guided-task-first-mobile-header
          fetch-depth: 0

      - name: Extract exact failing test block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/property/__tests__/dossierUx.test.ts")
          text = path.read_text()
          phrase = "fixed full-width workbench"
          phrase_index = text.find(phrase)
          if phrase_index < 0:
              raise SystemExit("Target phrase not found")
          start = text.rfind("\n  it(", 0, phrase_index)
          if start < 0:
              start = text.rfind("it(", 0, phrase_index)
          else:
              start += 1
          if start < 0:
              raise SystemExit("Target test start not found")
          next_test = text.find("\n  it(", phrase_index + len(phrase))
          end = len(text) if next_test < 0 else next_test
          output = Path("tmp/dossier-desktop-shell-test.txt")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(text[start:end].rstrip() + "\n")
          Path(".github/workflows/temporary-extract-dossier-test.yml").unlink()
          PY

      - name: Commit extracted evidence only
        shell: bash
        run: |
          git config user.name "Easy Erf verification automation"
          git config user.email "actions@users.noreply.github.com"
          git add tmp/dossier-desktop-shell-test.txt .github/workflows/temporary-extract-dossier-test.yml
          git commit -m "Extract stale desktop workbench guardrail"
          git push origin HEAD:chatgpt/guided-task-first-mobile-header
