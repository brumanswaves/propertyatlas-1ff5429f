name: Temporary extract failing dossier guardrail

on:
  push:
    branches:
      - chatgpt/guided-task-first-mobile-header
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-extract-dossier-guardrail
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guided-task-first-mobile-header
          fetch-depth: 0

      - name: Copy dossier guardrails verbatim
        shell: bash
        run: |
          mkdir -p tmp
          cp src/components/property/__tests__/dossierUx.test.ts tmp/dossierUx-copy.txt
          rm .github/workflows/temporary-extract-dossier-test.yml

      - name: Commit extracted evidence only
        shell: bash
        run: |
          git config user.name "Easy Erf verification automation"
          git config user.email "actions@users.noreply.github.com"
          git add tmp/dossierUx-copy.txt .github/workflows/temporary-extract-dossier-test.yml
          git commit -m "Copy dossier guardrails for stale assertion inspection"
          git push origin HEAD:chatgpt/guided-task-first-mobile-header
