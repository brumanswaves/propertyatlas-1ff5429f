name: Temporary verified Lovable cutover revert

on:
  push:
    branches:
      - chatgpt/revert-lovable-cutover-4c5933d
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-revert-lovable-cutover
  cancel-in-progress: true

jobs:
  restore:
    name: Restore approved 10e97bbc tree and verify it
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/revert-lovable-cutover-4c5933d

      - name: Restore only the six files changed by the unapproved Lovable cutover
        shell: bash
        run: |
          set -euo pipefail
          APPROVED=10e97bbcd2f88d3db36f084a5976c196b59be35e
          git checkout "$APPROVED" -- \
            .env \
            bun.lock \
            package.json \
            src/integrations/supabase/client.ts \
            src/integrations/supabase/types.ts
          git rm -f src/integrations/supabase/previewAuthStorage.ts
          git rm -f .github/workflows/temporary-revert-lovable-cutover.yml

          echo 'Changed paths:'
          git status --short

          unexpected="$(git diff --name-only "$APPROVED" -- .)"
          if [ -n "$unexpected" ]; then
            echo 'Recovery working tree does not exactly match the approved commit before install:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Install dependencies using the canonical repository CI path
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Verify tests
        shell: bash
        run: npx vitest run

      - name: Verify founder OAuth transport
        shell: bash
        run: node scripts/verify-founder-oauth.mjs

      - name: Verify TypeScript
        shell: bash
        run: npx tsc --noEmit

      - name: Verify production build
        shell: bash
        run: npm run build

      - name: Restore generated lock drift and verify exact approved tree
        shell: bash
        run: |
          set -euo pipefail
          APPROVED=10e97bbcd2f88d3db36f084a5976c196b59be35e
          git checkout "$APPROVED" -- package-lock.json
          git diff --check
          unexpected="$(git diff --name-only "$APPROVED" -- .)"
          if [ -n "$unexpected" ]; then
            echo 'Recovery working tree drifted from the approved commit:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit recovery to the recovery branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TuismoreAI'
          git config user.email 'brumanswaves@gmail.com'
          git add -A
          git commit -m 'Revert unapproved Lovable Supabase cutover'
          git push origin HEAD:chatgpt/revert-lovable-cutover-4c5933d
